// develop 에 의도적으로 남긴 red 게이트(.github/ci-expected-failures.json)의 unit test 를
// CI 실행에서 제외한다. 게이트가 조용히 사라지는 것은 아니다 — 같은 job 의
// `ci-expected-failures.mjs probe-unit` 이 제외된 테스트만 다시 돌려, 통과하기 시작하면
// 목록 제거를 요구하며 job 을 실패시킨다(XPASS 감시).
import groovy.json.JsonSlurper

// included build(build-logic)에는 currentDir 가 하위 디렉터리로 잡히므로 저장소 루트를
// 향해 걸어 올라가며 목록을 찾는다. 어디에도 없으면 fail-closed.
def configFile = null
def candidateDir = gradle.startParameter.currentDir
while (candidateDir != null) {
    def candidate = new File(candidateDir, '.github/ci-expected-failures.json')
    if (candidate.file) {
        configFile = candidate
        break
    }
    candidateDir = candidateDir.parentFile
}
if (configFile == null) {
    throw new GradleException("기대 실패 목록이 없습니다: ${gradle.startParameter.currentDir} 위로 .github/ci-expected-failures.json 탐색 실패")
}

def expected = new JsonSlurper().parse(configFile, 'UTF-8')
def excludesByTaskPath = [:]
(expected.unitTests ?: []).each { entry ->
    excludesByTaskPath[entry.task] =
        (entry.tests ?: []).collect { testName -> "${entry.className}.${testName}".toString() }
}

allprojects { project ->
    project.tasks.withType(org.gradle.api.tasks.testing.Test).configureEach { task ->
        def patterns = excludesByTaskPath[task.path]
        if (patterns) {
            patterns.each { pattern -> task.filter.excludeTestsMatching(pattern) }
            task.doFirst {
                task.logger.lifecycle(
                    "CI 기대 실패 제외 ${task.path}: ${patterns.size()}건 (.github/ci-expected-failures.json)",
                )
            }
        }
    }
}
