# 리뷰어 자동 요청 (#1136)
#
# 리뷰 요청을 손으로 걸다 보면 빠뜨린다. PR 이 열리면 작성자를 뺀 팀 전원에게
# 자동으로 요청한다. GitHub 은 자기 PR 의 작성자를 리뷰어로 받지 않으므로
# 목록에 전원을 적어도 작성자는 자동으로 빠진다.
#
# 이 워크플로는 review-debt-guard 와 한 세트다. 요청이 자동으로 걸려야
# "리뷰를 안 하면 새 PR 을 못 연다" 가 성립한다 — 요청을 손으로 걸던 때는
# 아예 걸지 않는 것으로 가드를 통과할 수 있었다.
#
# 옛 Review Assign(.github/workflows/PRassign.yml)을 대체한다. 그쪽은 develop
# 에서 파일만 지워졌을 뿐 워크플로 등록이 살아 있어, 파일이 남은 옛 브랜치에서
# 갈라진 PR 에는 지금도 구버전이 실행된다. 이 워크플로를 들이면서 함께 disable
# 해야 중복 요청이 나지 않는다.
name: review-request-all

on:
  pull_request:
    types: [opened, ready_for_review, reopened]

permissions:
  pull-requests: write

jobs:
  request:
    # draft 에는 걸지 않는다. 리뷰할 수 없는 PR 로 남의 미처리 건수를 늘리면
    # review-debt-guard 가 그 사람의 새 PR 을 닫아 버린다.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: 작성자를 뺀 전원에게 리뷰 요청
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          TEAM: 1hyok koongmai Sadturtleman
        run: |
          set -euo pipefail

          case "$AUTHOR" in
            *'[bot]'|dependabot|github-actions) echo "봇 PR — 건너뜀"; exit 0 ;;
          esac

          # 외부 기여자 PR 은 토큰이 read-only 라 요청을 걸 수 없다.
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "외부 기여자($ASSOCIATION) — 건너뜀"; exit 0 ;;
          esac

          # 이미 걸려 있는 요청은 다시 걸지 않는다. reopened·ready_for_review 가
          # 여러 번 오갈 때 같은 사람에게 요청이 반복되는 것을 막는다.
          current=$(gh api "repos/$REPO/pulls/$PR_NUMBER" \
            --jq '[.requested_reviewers[].login] | join(" ")')

          targets=""
          for u in $TEAM; do
            [ "$u" != "$AUTHOR" ] || continue
            case " $current " in
              *" $u "*) continue ;;
            esac
            targets="${targets:+$targets,}$u"
          done

          if [ -z "$targets" ]; then
            echo "추가할 리뷰어 없음 (이미 요청됨 또는 작성자뿐)"
            exit 0
          fi

          echo "리뷰 요청: $targets"
          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-reviewer "$targets"
