name: Conflict Label

# 충돌 PR 은 `pull_request` 워크플로가 트리거되지 않는다 (#1028) — GitHub 이 base 와 head 를
# 합친 `refs/pull/<N>/merge` 를 만들지 못하기 때문이다. 그래서 이 워크플로는 `pull_request` 를
# 쓰지 않는다. 충돌을 만들어 내는 쪽(develop 이 움직이는 순간)과 주기 실행으로 상태를 따라간다.
on:
  push:
    branches: [develop]
  schedule:
    # 보조 경로. develop push 로 대부분 잡히지만, mergeable 이 끝내 UNKNOWN 이라 보류된 PR 은
    # 다음 주기에 확정된다. 정각 부하를 피해 매시 23분.
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: "라벨·코멘트를 쓰지 않고 계획만 출력"
        required: false
        default: false
        type: boolean

# 실행이 겹치면 같은 PR 에 코멘트가 두 번 달릴 수 있다. 취소하지 않고 줄을 세운다.
concurrency:
  group: conflict-label
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label conflicting pull requests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run script tests
        run: node --test .github/scripts/label-conflicting-prs.test.mjs

      - name: Label conflicting pull requests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: node .github/scripts/label-conflicting-prs.mjs
