name: Gradle Dependency Submission

# develop·main push 는 신뢰된 base snapshot 을 직접 제출한다. PR 은 fork 를 포함해 write token 없이
# snapshot artifact 만 만들고, default branch 의 별도 workflow_run 이 이를 제출한다.
#
# main 이 함께 있어야 하는 이유 — dependency-review 는 PR 의 base ref 스냅샷과 head 스냅샷을
# 짝지어 «추가된 의존성» 을 계산한다. develop 만 제출하면 릴리스 PR(develop → main)의 base 가
# 빈 것으로 보여 의존성 전량이 신규 도입으로 잡히고, 그 안에 섞인 기존 취약점이 릴리스 PR
# 탓으로 걸린다 (#1063).
on:
  push:
    branches: [develop, main]
  pull_request:

concurrency:
  group: gradle-dependency-submission-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  submit-trusted-branch:
    if: github.event_name == 'push'
    name: Submit trusted branch dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # base(develop)·head(PR) 스냅샷이 같은 correlator 라야 compare API 가 둘을 짝짓는다.
      # job 이름을 따라 갈리면 develop base PR 에서 base 가 0 건으로 보여 그 PR 의 의존성
      # 전량이 «신규 도입» 으로 계산되고, 기존 의존성의 취약점이 그 PR 탓으로 걸린다 (#1009).
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: afternote-gradle-dependency-graph
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache --stacktrace
          cache-provider: basic
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false
          validate-wrappers: true

  generate-pr-snapshot:
    if: github.event_name == 'pull_request'
    name: Generate PR dependency graph
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # base(develop)·head(PR) 스냅샷이 같은 correlator 라야 compare API 가 둘을 짝짓는다.
      # job 이름을 따라 갈리면 develop base PR 에서 base 가 0 건으로 보여 그 PR 의 의존성
      # 전량이 «신규 도입» 으로 계산되고, 기존 의존성의 취약점이 그 PR 탓으로 걸린다 (#1009).
      GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: afternote-gradle-dependency-graph
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Generate dependency graph artifact
        uses: gradle/actions/dependency-submission@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          additional-arguments: --no-configuration-cache --stacktrace
          artifact-retention-days: 1
          cache-provider: basic
          cache-read-only: true
          dependency-graph: generate-and-upload
          dependency-graph-continue-on-failure: false
          validate-wrappers: true
