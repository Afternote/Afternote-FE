name: Evaluate QA Distribution Candidate

# pull_request 트리거를 쓰지 않는다 — pull_request 워크플로는 GITHUB_TOKEN 외 secret을 참조할 수
# 없다는 #842 불변식과 COPILOT_PERSONAL_TOKEN 주입이 충돌한다. 대신 develop push(=PR 머지 결과)에서
# 병합 커밋 SHA로 머지 PR을 복원해 같은 판단을 수행한다.
on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "다시 판단할 develop 머지 PR 번호"
        required: true
        type: number

concurrency:
  group: qa-distribution-decision-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eligible: ${{ steps.resolve.outputs.eligible }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
    steps:
      # push 이벤트에는 PR 컨텍스트가 없다. merge_commit_sha가 pushed SHA와 일치하는
      # develop 대상 PR만 인정하고, 머지 PR이 없는 직접 push는 판단 대상에서 제외한다.
      - name: Resolve merged pull request
        id: resolve
        uses: actions/github-script@v9
        env:
          DISPATCH_PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('eligible', 'true');
              core.setOutput('pr_number', process.env.DISPATCH_PR_NUMBER);
              return;
            }
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });
            const merged = pulls.find(
              (pull) => pull.merge_commit_sha === context.sha && pull.base.ref === 'develop',
            );
            if (!merged) {
              core.notice(`push ${context.sha}에 대응하는 develop 머지 PR이 없어 배포 판단을 건너뜁니다.`);
              core.setOutput('eligible', 'false');
              core.setOutput('pr_number', '');
              return;
            }
            core.setOutput('eligible', 'true');
            core.setOutput('pr_number', String(merged.number));

  prepare:
    needs: resolve
    if: needs.resolve.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    outputs:
      audit_eligible: ${{ steps.prepare-audit.outputs.audit_eligible }}
    steps:
      - name: Clone merged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
          fetch-depth: 0
          persist-credentials: false

      - name: Collect pending deployment context
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
          DEPLOYMENT_CONTEXT_PATH: ${{ runner.temp }}/afternote-deployment-decision/context.json
        run: node .github/scripts/collect-deployment-decision-context.mjs

      - name: Evaluate deployment boundary
        env:
          DEPLOYMENT_CONTEXT_PATH: ${{ runner.temp }}/afternote-deployment-decision/context.json
          DEPLOYMENT_DECISION_PATH: ${{ runner.temp }}/afternote-deployment-decision/boundary.json
        run: |
          node .github/scripts/evaluate-deployment-decision.mjs \
            "$DEPLOYMENT_CONTEXT_PATH" \
            "$DEPLOYMENT_DECISION_PATH"

      - name: Prepare canonical AI audit input
        id: prepare-audit
        env:
          DEPLOYMENT_CONTEXT_PATH: ${{ runner.temp }}/afternote-deployment-decision/context.json
          DEPLOYMENT_DECISION_PATH: ${{ runner.temp }}/afternote-deployment-decision/boundary.json
          QA_AUDIT_INPUT_PATH: ${{ runner.temp }}/afternote-deployment-decision/audit-input.json
          QA_AUDIT_PROMPT_PATH: ${{ runner.temp }}/afternote-deployment-decision/audit-prompt.txt
        run: |
          node .github/scripts/qa-semantic-audit.mjs prepare \
            "$DEPLOYMENT_CONTEXT_PATH" \
            "$DEPLOYMENT_DECISION_PATH" \
            "$QA_AUDIT_INPUT_PATH" \
            "$QA_AUDIT_PROMPT_PATH"

      - name: Preserve deterministic decision evidence
        uses: actions/upload-artifact@v4
        with:
          name: qa-semantic-audit-input
          path: ${{ runner.temp }}/afternote-deployment-decision
          if-no-files-found: error
          retention-days: 7

  semantic-audit:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    steps:
      - name: Clone merged revision
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'develop' }}
          persist-credentials: false

      - name: Load deterministic decision evidence
        uses: actions/download-artifact@v4
        with:
          name: qa-semantic-audit-input
          path: ${{ runner.temp }}/afternote-deployment-decision

      - name: Detect personal Copilot token
        id: personal-token
        env:
          COPILOT_PERSONAL_TOKEN: ${{ secrets.COPILOT_PERSONAL_TOKEN }}
        run: |
          if [ -n "$COPILOT_PERSONAL_TOKEN" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 22 for Copilot CLI
        if: needs.prepare.outputs.audit_eligible == 'true' && steps.personal-token.outputs.available == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install pinned Copilot CLI
        id: install-copilot
        if: needs.prepare.outputs.audit_eligible == 'true' && steps.personal-token.outputs.available == 'true'
        continue-on-error: true
        run: npm install --global @github/copilot@1.0.80

      # PR·이슈 본문은 untrusted input이다. 사용자 소유 fine-grained PAT는 이 step에만
      # 주입하고 모든 도구를 거부한다. 모델 응답도 다음 step의 strict validator가
      # 원천 ID 그룹·우선순위 외 필드를 거부하므로 QA 행동·기대 결과를 바꿀 수 없다.
      - name: Audit QA source semantics
        id: copilot-audit
        if: needs.prepare.outputs.audit_eligible == 'true' && steps.personal-token.outputs.available == 'true' && steps.install-copilot.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 5
        working-directory: ${{ runner.temp }}
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PERSONAL_TOKEN }}
          COPILOT_HOME: ${{ runner.temp }}/copilot-home
          COPILOT_MODEL: ${{ vars.QA_SEMANTIC_AUDIT_MODEL }}
          QA_AUDIT_PROMPT_PATH: ${{ runner.temp }}/afternote-deployment-decision/audit-prompt.txt
          QA_AUDIT_RESPONSE_PATH: ${{ runner.temp }}/afternote-deployment-decision/audit-response.txt
        run: |
          model_args=()
          if [ -n "$COPILOT_MODEL" ]; then
            model_args=(--model "$COPILOT_MODEL")
          fi
          copilot -s \
            --no-ask-user \
            --no-auto-update \
            --no-custom-instructions \
            --no-remote \
            --no-remote-export \
            --disable-builtin-mcps \
            --deny-tool='shell,write,read,url,memory' \
            --max-ai-credits=1 \
            --secret-env-vars=COPILOT_GITHUB_TOKEN \
            "${model_args[@]}" \
            < "$QA_AUDIT_PROMPT_PATH" \
            > "$QA_AUDIT_RESPONSE_PATH"

      - name: Validate and finalize audit result
        env:
          DEPLOYMENT_DECISION_PATH: ${{ runner.temp }}/afternote-deployment-decision/boundary.json
          QA_AUDIT_INPUT_PATH: ${{ runner.temp }}/afternote-deployment-decision/audit-input.json
          QA_AUDIT_RESPONSE_PATH: ${{ runner.temp }}/afternote-deployment-decision/audit-response.txt
          FINAL_DECISION_PATH: ${{ runner.temp }}/afternote-deployment-decision/final-decision.json
          QA_AI_CHANNEL_STATUS: token=${{ steps.personal-token.outputs.available }};install=${{ steps.install-copilot.outcome }};request=${{ steps.copilot-audit.outcome }}
          QA_SEMANTIC_AUDIT_MODEL: ${{ vars.QA_SEMANTIC_AUDIT_MODEL }}
        run: |
          node .github/scripts/qa-semantic-audit.mjs finalize \
            "$DEPLOYMENT_DECISION_PATH" \
            "$QA_AUDIT_INPUT_PATH" \
            "$QA_AUDIT_RESPONSE_PATH" \
            "$FINAL_DECISION_PATH"

      - name: Preserve final QA audit
        uses: actions/upload-artifact@v4
        with:
          name: qa-deployment-decision
          path: ${{ runner.temp }}/afternote-deployment-decision/final-decision.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [resolve, prepare, semantic-audit]
    if: ${{ always() && needs.prepare.result == 'success' && needs.semantic-audit.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Load final QA audit
        uses: actions/download-artifact@v4
        with:
          name: qa-deployment-decision
          path: ${{ runner.temp }}/afternote-deployment-decision

      - name: Publish decision on the merged PR
        uses: actions/github-script@v9
        env:
          DEPLOYMENT_DECISION_PATH: ${{ runner.temp }}/afternote-deployment-decision/final-decision.json
          TARGET_PR_NUMBER: ${{ needs.resolve.outputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- qa-distribution-decision -->';
            const result = JSON.parse(fs.readFileSync(process.env.DEPLOYMENT_DECISION_PATH, 'utf8'));
            const audit = result.qaAudit || { status: 'human_review_required' };
            const clean = (value) => String(value ?? '')
              .replace(/\s+/g, ' ')
              .replaceAll('&', '&amp;')
              .replaceAll('<', '&lt;')
              .replaceAll('>', '&gt;')
              .replaceAll('@', '@\u200b')
              .trim();
            const title = audit.status === 'human_review_required'
              ? '🧑‍🔍 QA 사람 검토 필요'
              : result.decision === 'deploy'
                ? '🚀 QA 배포 권장'
                : '⏸️ QA 배포 보류';
            const issues = (result.includedIssues || []).map((number) => `#${number}`).join(', ');
            const body = [
              marker,
              `## ${title}`,
              '',
              `- 위험도: \`${result.risk}\``,
              `- 의미 감사: \`${audit.status}\``,
              `- 포함 이슈: ${issues || '연결 이슈 없음'}`,
              `- 판단 근거: ${clean(result.reason)}`,
            ];

            body.push('', '### QA 시나리오');
            if (audit.status === 'ready') {
              for (const scenario of result.qaScenarios || []) {
                const scenarioIssues = (scenario.issueNumbers || []).map((number) => `#${number}`).join(', ');
                body.push(
                  '',
                  `#### ${clean(scenario.priority)} ${scenarioIssues || `PR ${scenario.pullRequestNumbers.map((number) => `#${number}`).join(', ')}`}`,
                  `- 사전조건: ${clean(scenario.precondition)}`,
                  `- 행동: ${clean(scenario.action)}`,
                  `- 기대 결과: ${clean(scenario.expected)}`,
                  `- 실패 위험: ${clean(scenario.risk)}`,
                  `- 근거: ${scenario.evidence.map((item) => `${clean(item.ref)} (${clean(item.assertion)})`).join(', ')}`,
                );
                if (scenario.mergeReason) {
                  body.push(`- 병합 근거: ${clean(scenario.mergeReason)}`);
                }
              }
            } else if (audit.status === 'not_required') {
              body.push(`- ${clean(audit.reason || '이미 배포된 대상이어서 추가 QA가 필요하지 않습니다.')}`);
            } else {
              body.push('- generic QA 문구를 만들지 않았습니다. 아래 오류를 해결하고 사람이 QA 원천을 검토해야 합니다.');
              for (const error of audit.errors || []) {
                body.push(`  - ${clean(error)}`);
              }
            }

            body.push('', '### 앱 QA 제외');
            if ((audit.exclusions || []).length === 0) {
              body.push('- 없음');
            } else {
              for (const exclusion of audit.exclusions) {
                const excludedIssues = exclusion.issueNumbers.map((number) => `#${number}`).join(', ');
                body.push(
                  `- PR #${exclusion.pullRequestNumber}${excludedIssues ? ` (${excludedIssues})` : ''}: ${clean(exclusion.reason)} — ${exclusion.evidence.map((item) => clean(item.ref)).join(', ')}`,
                );
              }
            }

            body.push('', '### 검증 공백');
            if ((audit.coverageGaps || []).length === 0) {
              body.push('- 없음');
            } else {
              for (const gap of audit.coverageGaps) {
                body.push(`- ${gap.sourceIds.map(clean).join(', ')}: ${clean(gap.gap)} (권장: ${clean(gap.recommendedVerification)})`);
              }
            }

            body.push(
              '',
              '> 이 워크플로는 Firebase 배포를 자동 실행하지 않습니다. `human_review_required`에서는 QA 시나리오를 임의 생성하거나 배포를 권장하지 않습니다.',
            );
            const commentBody = body.join('\n');

            const issueNumber = Number(process.env.TARGET_PR_NUMBER);
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: commentBody,
              });
            }
            await core.summary.addRaw(commentBody).write();
