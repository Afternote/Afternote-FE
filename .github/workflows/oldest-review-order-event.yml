name: Oldest Review Order Event

# 공개 저장소의 fork와 Dependabot PR에서도 이벤트를 빠짐없이 감지한다. 이 workflow는
# PR 코드를 실행하거나 API를 호출하지 않는다. 완료 이벤트만 trusted default-branch의
# Oldest Review Order workflow로 넘기고, 실제 조회와 status 쓰기는 그곳에서 수행한다.
on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request:
    types:
      - opened
      - reopened
      - closed
      - synchronize
      - ready_for_review
      - converted_to_draft
      - review_requested
      - review_request_removed

permissions: {}

jobs:
  signal:
    name: Signal oldest review order reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record event
        run: echo 'Review-order state changed.'
