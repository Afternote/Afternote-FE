name: Base Freshness Probe

# pull_request code에는 쓰기 토큰을 주지 않는다. 이 읽기 전용 실행의 workflow_run을
# default branch의 Base Freshness Publisher가 받아 live base ancestry를 commit status로
# 기록한다. push 신호는 스택 PR의 부모 브랜치가 전진한 경우도 같은 방식으로 갱신한다.
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  merge_group:
    types: [checks_requested]
  push:
  # GITHUB_TOKEN이 PR head에 commit을 만들면 pull_request synchronize가 발생하지
  # 않으므로, 해당 automation bridge가 같은 head ref로 이 신호를 명시적으로 보낸다.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "현재 ref와 일치해야 하는 열린 PR 번호"
        required: true
        type: number

concurrency:
  group: base-freshness-probe-${{ github.event.pull_request.number || inputs.pull_request_number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  signal:
    if: github.event_name != 'merge_group'
    name: Schedule Base Freshness Evaluation
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Hand off to the trusted publisher
        run: echo "The default-branch workflow_run publisher evaluates current base ancestry."

  merge-group:
    if: github.event_name == 'merge_group'
    name: Base Freshness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Clone trusted freshness policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify merge group contains the live base
        env:
          BASE_FRESHNESS_MODE: merge-group
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/evaluate-base-freshness.mjs
