name: Release Distribution (Firebase App Distribution)

# main 은 릴리스 때만 머지하고 테스터 배포는 수시로 도는 팀 운영이라 배포 경로를 둘로 나눴다.
# workflow_dispatch 는 워크플로 파일이 default branch(develop) 에 있어야 실행 목록에 뜬다 —
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: "포함 이슈 번호 (#716, #723 형식)"
        required: true
        type: string
      qa_points:
        description: "QA 포인트 (여러 건은 세미콜론으로 구분)"
        required: true
        type: string

# 같은 Firebase App Distribution 앱에 올리는 경로를 전부 이 group 하나로 직렬화한다 — 수동 배포
# 도중 main 릴리스 push 가 들어오거나 WIF canary(firebase-wif-canary.yml)가 겹치면 러너 둘이 같은
# 앱에 업로드한다. group 문자열은 두 워크플로가 공유하므로 한쪽만 바꾸면 방호가 풀린다 (#995).
# cancel-in-progress 는 기본값(false) 그대로 — 진행 중 업로드가 취소되면 부분 상태가 남는다.
concurrency:
  group: firebase-app-distribution-upload

permissions:
  contents: read
  pull-requests: read

jobs:
  distribute:
    name: Build Release and Upload to Firebase App Distribution
    runs-on: ubuntu-latest
    # 보호 규칙(deployment branch 제한·required reviewer·environment secret)은 워크플로 파일로
    # 지정할 수 없다 — 여긴 연결점만 만들고 실제 설정은 Settings → Environments 에서 한다.
    environment: release-distribution
    steps:
      # 이 job 은 release keystore·Firebase service account 를 받으므로 임의 ref 실행이 곧 secret 반출이다.
      # workflow_dispatch 엔 push 와 달리 branches 필터가 없어 checkout 앞에서 직접 막는다.
      - name: Restrict manual runs to deployable branches
        if: github.event_name == 'workflow_dispatch'
        env:
          SELECTED_REF: ${{ github.ref }}
        run: |
          case "$SELECTED_REF" in
            refs/heads/develop|refs/heads/main) ;;
            *)
              echo "::error::수동 배포는 develop·main 에서만 허용됩니다 (선택된 ref: $SELECTED_REF)"
              exit 1
              ;;
          esac

      - name: Clone repo
        uses: actions/checkout@v7

      - name: Load release metadata from main PR
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR_BODY_FILE: ${{ runner.temp }}/main-release-pr-body.md
        run: |
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | sort_by(.merged_at) | last | .body // empty' \
            > "$RELEASE_PR_BODY_FILE"

      - name: Prepare Firebase release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
          QA_POINTS: ${{ inputs.qa_points }}
          RELEASE_PR_BODY_FILE: ${{ runner.temp }}/main-release-pr-body.md
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-app-distribution-release-notes.txt
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/render-distribution-release-notes.sh "$RELEASE_NOTES_FILE"
          cat "$RELEASE_NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      - name: Set up release build configuration
        id: release_config
        uses: ./.github/actions/setup-release-config
        with:
          require: >-
            KAKAO_NATIVE_APP_KEY GOOGLE_WEB_CLIENT_ID GOOGLE_SERVICES_JSON_B64
            RELEASE_STORE_FILE_B64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS
            RELEASE_KEY_PASSWORD FIREBASE_SERVICE_ACCOUNT_JSON
          kakao-native-app-key: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          google-services-json-b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          release-store-file-b64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          release-store-password: ${{ secrets.RELEASE_STORE_PASSWORD }}
          release-key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          release-key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}
          firebase-service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          compose-local-properties: 'true'

      # Firebase App Distribution Gradle plugin 이 GOOGLE_APPLICATION_CREDENTIALS 환경변수로
      # service account JSON 경로를 인식. plugin DSL 의 serviceCredentialsFile 미지정 시 fallback.
      # 참고: https://firebase.google.com/docs/app-distribution/android/distribute-gradle
      - name: Build release APK and upload to Firebase App Distribution
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ steps.release_config.outputs.firebase-credentials-path }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-app-distribution-release-notes.txt
        run: |
          ./gradlew assembleRelease appDistributionUploadRelease \
            --releaseNotesFile="$RELEASE_NOTES_FILE" \
            --no-daemon

      - name: Remove release build configuration
        if: always()
        uses: ./.github/actions/cleanup-release-config
        with:
          keystore-path: ${{ steps.release_config.outputs.keystore-path }}
          firebase-credentials-path: ${{ steps.release_config.outputs.firebase-credentials-path }}
