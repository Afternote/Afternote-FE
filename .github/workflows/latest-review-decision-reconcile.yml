name: Latest Review Decision Reconcile

on:
  workflow_run:
    workflows: [Latest Review Decision Event]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Optional pull request number; empty reconciles every open PR
        required: false
        type: string

concurrency:
  group: latest-review-decision-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    name: Reconcile latest review decisions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Clone trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile latest review decisions
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PULL_NUMBER: >-
            ${{ inputs.pull_number || github.event.workflow_run.pull_requests[0].number }}
        run: node .github/scripts/reconcile-latest-review-decision.mjs
