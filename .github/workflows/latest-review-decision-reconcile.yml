name: Latest Review Decision Reconcile

on:
  workflow_run:
    workflows: [Latest Review Decision Event]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Optional pull request number; empty reconciles every open PR
        required: false
        type: string

concurrency:
  group: latest-review-decision-${{ github.repository }}
  cancel-in-progress: false

permissions: {}

jobs:
  reconcile:
    name: Reconcile latest review decisions
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Clone trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Reconcile latest review decisions
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_PULL_NUMBER: >-
            ${{ inputs.pull_number || github.event.workflow_run.pull_requests[0].number }}
        run: node .github/scripts/reconcile-latest-review-decision.mjs

  # 승인 직후 «Merge when ready» 를 대신 건다. 머지 자체는 GitHub 가 승인 수·required check·
  # merge queue 를 모두 통과한 뒤에 하므로 CI 가 빨갛거나 변경요청이 남으면 머지되지 않는다.
  # 리컨사일이 낡은 변경요청을 걷은 뒤의 판정을 보려고 needs 로 잇는다. 리뷰어의 파일 Viewed
  # 체크는 토큰 주인 본인 것만 조회되고 이벤트도 없어 조건에 넣지 못한다(판정 스크립트 머리말).
  auto-merge:
    name: Enable auto-merge on approval
    needs: reconcile
    if: github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Clone decision script from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          NAME: ${{ github.event.repository.name }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          QUERY: |
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  state isDraft baseRefName headRefOid reviewDecision isInMergeQueue
                  autoMergeRequest { enabledAt }
                  reviews(last: 1) { nodes { state commit { oid } } }
                }
              }
            }
        run: |
          set -euo pipefail
          gh api graphql -F owner="$OWNER" -F name="$NAME" -F number="$PR_NUMBER" -f query="$QUERY" \
            > "$RUNNER_TEMP/pull-request.json"
          node .github/scripts/decide-auto-merge-on-approval.mjs "$RUNNER_TEMP/pull-request.json"

      - name: Enable auto-merge
        if: steps.decide.outputs.enable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ steps.decide.outputs.head_sha }}
        run: |
          # merge queue 대상이면 전략 없이 부른다. check 가 남았으면 auto-merge, 끝났으면 큐 투입이다.
          # 스택 PR 처럼 GitHub 가 거부하는 경우는 사람이 버튼을 누르면 되므로 경고로 남긴다.
          if ! gh pr merge "$PR_NUMBER" --match-head-commit "$HEAD_SHA"; then
            echo "::warning::#$PR_NUMBER 자동 머지 예약 실패 — PR 화면에서 Merge when ready 를 직접 누르세요"
          fi
