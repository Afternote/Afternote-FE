name: Generate Screenshot Baselines

# PR 의 *ScreenshotTest.kt 가 선언한 Preview/상태만 CI 표준 이미지에서 다시 렌더한다.
# 이 비권한 워크플로는 PR 코드를 실행하므로 쓰기 토큰을 갖지 않고, binary patch 만 넘긴다.
on:
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "baseline 을 갱신할 열린 PR 번호"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: screenshot-baseline-${{ inputs.pull_request_number }}
  cancel-in-progress: true

jobs:
  generate:
    name: Render and validate baselines
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Resolve exact PR head
        id: target
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          INPUT_PR_NUMBER: ${{ inputs.pull_request_number }}
        with:
          script: |
            const number = Number(process.env.INPUT_PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) {
              core.setFailed('pull_request_number must be a positive integer');
              return;
            }
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number,
            });
            if (pullRequest.state !== 'open') {
              core.setFailed(`PR #${number} is not open`);
              return;
            }
            if (pullRequest.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork PR baselines cannot be pushed to the source branch');
              return;
            }
            core.setOutput('number', String(number));
            core.setOutput('sha', pullRequest.head.sha);
            core.setOutput('branch', pullRequest.head.ref);

      - name: Clone exact PR head without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build CI screenshot image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.screenshot
          platforms: linux/amd64
          tags: afternote-screenshot:latest
          load: true
          cache-from: type=gha,scope=screenshot
          cache-to: type=gha,scope=screenshot,mode=max

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Generate then validate every screenshot baseline
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD":/workspace \
            -v "$HOME/.gradle":/root/.gradle \
            -w /workspace \
            -e KAKAO_NATIVE_APP_KEY \
            -e GOOGLE_WEB_CLIENT_ID \
            afternote-screenshot:latest \
            bash -lc './gradlew \
              :core:ui:updateScreenshotTest \
              :feature:home:presentation:updateScreenshotTest \
              :feature:receiver:presentation:updateScreenshotTest \
              :feature:onboarding:presentation:updateScreenshotTest \
              :feature:afternote:presentation:updateScreenshotTest \
              :feature:mindrecord:presentation:updateScreenshotTest \
              --rerun --no-daemon --console=plain \
              && ./gradlew \
              :core:ui:validateScreenshotTest \
              :feature:home:presentation:validateScreenshotTest \
              :feature:receiver:presentation:validateScreenshotTest \
              :feature:onboarding:presentation:validateScreenshotTest \
              :feature:afternote:presentation:validateScreenshotTest \
              :feature:mindrecord:presentation:validateScreenshotTest \
              --no-daemon --console=plain'

      - name: Restore workspace ownership
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$HOME/.gradle"

      - name: Package baseline-only binary patch
        env:
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
          TARGET_PR: ${{ steps.target.outputs.number }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/screenshot-baseline"
          mkdir -p "$artifact"

          git add -A -- \
            core/ui/src/screenshotTestDebug/reference \
            feature/home/presentation/src/screenshotTestDebug/reference \
            feature/receiver/presentation/src/screenshotTestDebug/reference \
            feature/onboarding/presentation/src/screenshotTestDebug/reference \
            feature/afternote/presentation/src/screenshotTestDebug/reference \
            feature/mindrecord/presentation/src/screenshotTestDebug/reference
          git diff --cached --binary --full-index > "$artifact/screenshot-baselines.patch"

          jq -n \
            --arg branch "$TARGET_BRANCH" \
            --arg headSha "$TARGET_SHA" \
            --argjson pullRequest "$TARGET_PR" \
            --argjson sourceRunId "$GITHUB_RUN_ID" \
            '{branch: $branch, headSha: $headSha, pullRequest: $pullRequest, sourceRunId: $sourceRunId}' \
            > "$artifact/metadata.json"

          changed=$(git diff --cached --name-only | wc -l | tr -d ' ')
          echo "생성된 baseline 변경: ${changed}개"
          git diff --cached --name-status

      - name: Upload baseline patch for privileged validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-baseline-patch
          path: ${{ runner.temp }}/screenshot-baseline/
          if-no-files-found: error
          retention-days: 1
