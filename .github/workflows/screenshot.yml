name: Compose Preview Screenshot Test

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshot-test:
    name: Validate Compose Preview Screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run validateScreenshotTest
        run: ./gradlew :core:ui:validateScreenshotTest :feature:onboarding:presentation:validateScreenshotTest --parallel
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      # 실패 시 diff/rendered 이미지를 artifact 로 업로드 — 본인이 다운로드해 시각 차이 확인 가능
      - name: Upload screenshot diff on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-results
          path: |
            core/ui/build/outputs/screenshotTest-results/
            feature/onboarding/presentation/build/outputs/screenshotTest-results/
          retention-days: 7
