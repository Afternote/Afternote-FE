name: Compose Preview Screenshot Test

# base 필터를 두지 않는다 — base 변경(feat/* → develop)은 pull_request 기본 activity type 에
# 없어 재트리거되지 않으므로, 필터가 있으면 스택 PR 이 검증을 한 번도 거치지 않고 머지된다.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  screenshot-test:
    name: Validate Compose Preview Screenshots
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      # docker buildx + gha cache 로 Dockerfile.screenshot 빌드.
      # 동일 이미지에서 baseline 생성·검증을 수행해 anti-aliasing/font/scale 등 host 환경 차이 root fix.
      # Dockerfile 변경 없으면 cache 재사용 — 분당 단위 추가 비용.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build screenshot image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.screenshot
          tags: afternote-screenshot:latest
          load: true
          cache-from: type=gha,scope=screenshot
          cache-to: type=gha,scope=screenshot,mode=max

      # :app 모듈은 google-services plugin 활성화 — processDebugGoogleServices 가 google-services.json 요구.
      # CI 환경엔 실 키 없으므로 stub JSON 생성 (Firebase 호출 안 함, plugin 통과 목적).
      # 실 분석/배포는 Firebase App Distribution 워크플로 (#298 영역) 에서 별도 secret 으로 처리.
      - name: Create stub google-services.json (CI only)
        run: |
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "afternote-ci-stub",
              "storage_bucket": "afternote-ci-stub.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "com.afternote.afternote_fe"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  { "current_key": "AIzaSyDfake_ci_only_no_real_value_xxxxxxxxxxx" }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      # setup-gradle 의 공개 MIT cache provider 로 host 의 Gradle home 을 복원한 뒤
      # 컨테이너 /root/.gradle 로 마운트한다. PR 은 cache poisoning 방지를 위해 읽기 전용이다.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Run validateScreenshotTest in container
        run: |
          docker run --rm \
            -v "$PWD":/workspace \
            -v "$HOME/.gradle":/root/.gradle \
            -w /workspace \
            -e KAKAO_NATIVE_APP_KEY \
            -e GOOGLE_WEB_CLIENT_ID \
            afternote-screenshot:latest \
            ./gradlew :core:ui:validateScreenshotTest \
                      :app:validateScreenshotTest \
                      :feature:onboarding:presentation:validateScreenshotTest \
                      :feature:afternote:presentation:validateScreenshotTest \
                      --parallel
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      # 컨테이너가 root 로 gradle 을 실행해 workspace · ~/.gradle 산출물이 root 소유가 된다.
      # job 종료 시 'Post Restore Gradle cache'(캐시 저장)의 hashFiles/tar 가 runner 권한이라
      # root 소유 파일에서 실패하므로, 소유권을 runner 로 복구한다.
      - name: Restore workspace ownership for post steps
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" "$HOME/.gradle"

      # 실패 시 diff/rendered 이미지를 artifact 로 업로드 — 본인이 다운로드해 시각 차이 확인 가능
      - name: Upload screenshot diff on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-test-results
          path: |
            core/ui/build/outputs/screenshotTest-results/
            app/build/outputs/screenshotTest-results/
            feature/onboarding/presentation/build/outputs/screenshotTest-results/
            feature/afternote/presentation/build/outputs/screenshotTest-results/
          retention-days: 7

      # 실패 시 PR 에 artifact URL + 조치 가이드 자동 코멘트.
      # 같은 PR 의 재실행에서는 기존 코멘트를 update (marker 로 중복 누적 방지).
      - name: Comment artifact URL on PR (failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- screenshot-fail-bot -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '❌ **Screenshot test fail** — baseline 과 CI rendered PNG 차이.',
              '',
              `📦 **Artifact**: ${runUrl} (페이지 하단 Artifacts → \`screenshot-test-results\`)`,
              '',
              '🔍 **확인 위치** (artifact zip 내부):',
              '- diff PNG: `preview/debug/diffs/...`',
              '- rendered PNG: `preview/debug/rendered/...` (CI 환경에서 새로 그린 결과)',
              '- baseline PNG: repo `<module>/src/screenshotTestDebug/reference/...` (`:core:ui` · `:app` · `:feature:onboarding:presentation` · `:feature:afternote:presentation`)',
              '',
              '📝 **조치 가이드**:',
              '- 의도된 시각 변경 → `docker build -t afternote-screenshot:latest -f Dockerfile.screenshot .` 후 `docker run --rm -v "$PWD":/workspace -w /workspace afternote-screenshot:latest ./gradlew :<module>:updateScreenshotTest` 로 baseline 갱신 + commit/push',
              '- diff 가 anti-aliasing/font 차이로 보이면 docker 환경 변경 여부 (Dockerfile.screenshot) 점검',
              '',
              'CI ↔ 로컬 환경 차이는 본 워크플로의 container 단계가 root fix 한다 (README 의 "Compose Preview Screenshot Testing (docker baseline)" 섹션 참조).',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
