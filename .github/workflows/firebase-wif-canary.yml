name: Firebase WIF Canary

# 기존 release-distribution의 JSON credential 경로는 실제 WIF canary가 성공할 때까지 유지한다.
# 이 workflow는 production 전환과 분리된 수동 검증 경로이며 Firebase 업로드를 실제 수행한다.
on:
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: "포함 이슈 번호 (#850 형식)"
        required: true
        default: "#850"
        type: string
      qa_points:
        description: "WIF canary QA 포인트"
        required: true
        default: "WIF ADC 인증으로 Firebase App Distribution 업로드 확인"
        type: string
      confirm_upload:
        description: "보호 Environment 승인 뒤 실제 canary APK를 업로드합니다"
        required: true
        default: false
        type: boolean

concurrency:
  group: firebase-wif-canary
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    name: Guard deployable ref and explicit upload confirmation
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Restrict canary to deployable branches
        env:
          CONFIRM_UPLOAD: ${{ inputs.confirm_upload }}
          SELECTED_REF: ${{ github.ref }}
        run: |
          case "$SELECTED_REF" in
            refs/heads/develop|refs/heads/main) ;;
            *)
              echo "::error::WIF canary는 develop·main에서만 실행할 수 있습니다."
              exit 1
              ;;
          esac

          if [ "$CONFIRM_UPLOAD" != "true" ]; then
            echo "::error::실제 Firebase canary 업로드 확인이 필요합니다."
            exit 1
          fi

  canary:
    name: Build signed APK and canary-upload with WIF
    needs: guard
    runs-on: ubuntu-latest
    environment: release-distribution
    permissions:
      contents: read
      id-token: write
    steps:
      # google-github-actions/auth가 ADC 파일을 안전하게 만들려면 checkout이 먼저 실행돼야 한다.
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Prepare Firebase release notes
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
          QA_POINTS: ${{ inputs.qa_points }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-wif-canary-release-notes.txt
          SOURCE_REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          bash .github/scripts/render-distribution-release-notes.sh "$RELEASE_NOTES_FILE"
          cat "$RELEASE_NOTES_FILE" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      # FIREBASE_SERVICE_ACCOUNT_JSON은 의도적으로 참조하지 않는다. 기존 production rollback
      # 경로에는 남겨 두되, 이 canary의 인증 성공 여부에는 영향을 줄 수 없게 분리한다.
      - name: Verify release build secrets are set
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          missing=""
          [ -z "$KAKAO_NATIVE_APP_KEY" ] && missing="$missing KAKAO_NATIVE_APP_KEY"
          [ -z "$GOOGLE_WEB_CLIENT_ID" ] && missing="$missing GOOGLE_WEB_CLIENT_ID"
          [ -z "$GOOGLE_SERVICES_JSON_B64" ] && missing="$missing GOOGLE_SERVICES_JSON_B64"
          [ -z "$RELEASE_STORE_FILE_B64" ] && missing="$missing RELEASE_STORE_FILE_B64"
          [ -z "$RELEASE_STORE_PASSWORD" ] && missing="$missing RELEASE_STORE_PASSWORD"
          [ -z "$RELEASE_KEY_ALIAS" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$RELEASE_KEY_PASSWORD" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::필수 release build secret 누락:$missing"
            exit 1
          fi

      - name: Decode release build files
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          RELEASE_STORE_FILE_B64: ${{ secrets.RELEASE_STORE_FILE_B64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json
          printf '%s' "$RELEASE_STORE_FILE_B64" | base64 -d > "$RUNNER_TEMP/afternote-release.jks"

      - name: Compose local.properties
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          {
            echo "KAKAO_NATIVE_APP_KEY=$KAKAO_NATIVE_APP_KEY"
            echo "GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/afternote-release.jks"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } > local.properties

      # public 저장소이므로 signed APK를 Actions artifact로 게시하거나 job 사이에 전달하지 않는다.
      - name: Build signed release APK without Google credentials
        id: release_apk
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
        run: |
          ./gradlew assembleRelease --no-daemon

          mapfile -t apk_files < <(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print)
          if [ "${#apk_files[@]}" -ne 1 ]; then
            echo "::error::업로드할 release APK가 정확히 1개여야 합니다."
            exit 1
          fi
          echo "path=${apk_files[0]}" >> "$GITHUB_OUTPUT"

      - name: Verify WIF configuration is set
        env:
          GCP_FIREBASE_SERVICE_ACCOUNT: ${{ secrets.GCP_FIREBASE_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        run: |
          missing=""
          [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && missing="$missing GCP_WORKLOAD_IDENTITY_PROVIDER"
          [ -z "$GCP_FIREBASE_SERVICE_ACCOUNT" ] && missing="$missing GCP_FIREBASE_SERVICE_ACCOUNT"
          if [ -n "$missing" ]; then
            echo "::error::필수 WIF 설정 누락:$missing"
            exit 1
          fi

      # v3 immutable SHA. 이 단계 전에는 Google OIDC token/ADC credential이 발급되지 않는다.
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Upload the already-built APK to Firebase App Distribution
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          RELEASE_APK_PATH: ${{ steps.release_apk.outputs.path }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/firebase-wif-canary-release-notes.txt
        run: |
          ./gradlew appDistributionUploadRelease \
            --artifactPath="$RELEASE_APK_PATH" \
            --releaseNotesFile="$RELEASE_NOTES_FILE" \
            --no-daemon

          {
            echo "### Firebase WIF canary"
            echo "- result: PASS"
            echo "- source: \`$GITHUB_SHA\`"
            echo "- run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove release build files
        if: always()
        run: |
          rm -f app/google-services.json local.properties "$RUNNER_TEMP/afternote-release.jks"
