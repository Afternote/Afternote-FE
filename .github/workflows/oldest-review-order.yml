name: Oldest Review Order

# GitHub은 리뷰 제출 자체를 사전에 막을 수 없다. 결정 리뷰가 제출된 직후 더 오래된
# 미처리 PR을 확인하고, 순서를 건너뛴 리뷰라면 그 리뷰를 dismiss한 뒤 job을 실패시킨다.
on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write

jobs:
  enforce:
    name: Enforce oldest pull request review first
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_review의 GITHUB_REF는 refs/pull/.../merge다. write token으로 PR의
      # 스크립트를 실행하지 않도록 항상 저장소의 trusted default branch를 checkout한다.
      - name: Clone trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Enforce oldest review order
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/enforce-oldest-review-order.mjs
