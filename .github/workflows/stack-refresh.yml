name: Refresh PR Stack

# 지정한 root PR 부터 선형 child 관계를 먼저 검증한 뒤 부모→자식 순으로 base 를 merge 한다.
# default branch 코드만 실행해 write token 이 PR 코드에 노출되지 않게 한다.
on:
  workflow_dispatch:
    inputs:
      root_pull_request:
        description: "스택의 첫 열린 PR 번호"
        required: true
        type: number
      max_depth:
        description: "한 번에 처리할 최대 PR 수"
        required: true
        default: "5"
        type: choice
        options:
          - "3"
          - "5"
          - "10"
      dry_run:
        description: "쓰기 없이 발견·갱신 계획만 출력"
        required: false
        default: false
        type: boolean

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: refresh-pr-stack
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    name: Refresh linear pull request stack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Clone trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run stack refresh tests
        run: node --test .github/scripts/refresh-pr-stack.test.mjs

      - name: Refresh stack and dispatch checks
        env:
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          GITHUB_TOKEN: ${{ github.token }}
          MAX_DEPTH: ${{ inputs.max_depth }}
          ROOT_PULL_REQUEST: ${{ inputs.root_pull_request }}
        run: node .github/scripts/refresh-pr-stack.mjs
