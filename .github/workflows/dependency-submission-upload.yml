name: Submit PR Dependency Graph

# workflow_run 은 default branch 의 검토된 workflow 정의로 실행된다. untrusted PR 코드는
# checkout·실행하지 않고 Gradle action 이 만든 dependency graph artifact 만 제출한다.
# upstream 은 소스 변경만 있는 PR 을 포함해 모든 PR HEAD 의 graph artifact 를 만든다.
# 성공한 producer 의 artifact 만 제출해 스택 부모의 비교 기준선도 같은 경계로 보관한다 (#2185).
on:
  workflow_run:
    workflows: [Generate PR Dependency Graph]
    types: [completed]

concurrency:
  group: submit-pr-dependency-graph-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  submit-pr-snapshot:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    name: Submit generated PR dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require dependency graph artifact
        id: dependency-graph-artifact
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.payload.workflow_run.id,
                per_page: 100,
              },
            );
            const available = artifacts.some(
              ({ expired, name }) => !expired && name.startsWith('dependency-graph_'),
            );
            core.setOutput('available', available ? 'true' : 'false');
            if (!available) {
              core.setFailed('Expected dependency graph artifact was not generated or has expired.');
            }

      - name: Download and submit dependency graph
        if: steps.dependency-graph-artifact.outputs.available == 'true'
        uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-disabled: true
          dependency-graph: download-and-submit
          dependency-graph-continue-on-failure: false
