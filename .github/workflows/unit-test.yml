name: Unit Test

# 모든 PR 에서 unit test 실행:
#   - node --test .github/scripts/*.test.mjs : 배포 판단 스크립트 회귀 가드.
#   - :koverXmlReportCi / :koverHtmlReportCi : Android debug + 순수 JVM 테스트와 aggregate coverage
#   - :konsist:test : 순수 JVM 모듈(testDebugUnitTest 미보유)이라 별도 명시. 레이어 의존 아키텍처 가드.
#   - :build-logic:test : included build 라 루트 태스크에 안 묶여 별도 명시. release 키 가드(TestKit) 회귀 가드.
#   - :app:compileDebugAndroidTestKotlin : androidTest 소스셋 컴파일 가드. GMD 스위트는 PR 트리거 없이
#     화·금 스케줄로만 돌아(android-managed-device.yml), main 코드 변경이 androidTest 를 깨뜨려도
#     머지 전 어디서도 검출되지 않았다(#936 — develop 컴파일 실패 44건). 에뮬레이터 없이 컴파일만 검증.
# lint.yml 과 setup 이 거의 동일하지만 분리 — lint 실패가 test 결과를 가리지 않도록 fail-fast 독립.

# base 필터를 두지 않는다 — base 변경(feat/* → develop)은 pull_request 기본 activity type 에
# 없어 재트리거되지 않으므로, 필터가 있으면 스택 PR 이 검증을 한 번도 거치지 않고 머지된다.
on:
  pull_request:

permissions:
  contents: read

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Fetch pull request history for changed-module coverage
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --prune --unshallow origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/kover-base" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/kover-head"

      - name: Run deployment script tests
        run: node --test .github/scripts/*.test.mjs

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run unit tests, androidTest compile guard, and aggregate Kover reports
        run: ./gradlew :koverXmlReportCi :koverHtmlReportCi :konsist:test :build-logic:test :app:compileDebugAndroidTestKotlin --continue --parallel

      - name: Upload Kover coverage reports
        id: kover-artifact
        uses: actions/upload-artifact@v4
        with:
          name: kover-jvm-coverage
          path: build/reports/kover/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize changed-module coverage
        env:
          KOVER_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          KOVER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          KOVER_ARTIFACT_URL: ${{ steps.kover-artifact.outputs.artifact-url }}
        run: node .github/scripts/render-kover-summary.mjs

      # 실패한 테스트의 HTML/XML 리포트를 PR artifact 로 보존 — CI 로그에서 stack trace 추적이 빠름.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest
            **/build/test-results/testDebugUnitTest
            **/build/reports/tests/test
            **/build/test-results/test
          retention-days: 7
