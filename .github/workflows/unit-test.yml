name: Unit Test

# 모든 PR 에서 unit test 실행:
#   - node --test .github/scripts/*.test.mjs : 배포 판단 스크립트 회귀 가드.
#   - :koverXmlReportCi / :koverHtmlReportCi : Android debug + 순수 JVM 테스트와 aggregate coverage
#   - :konsist:test : 순수 JVM 모듈(testDebugUnitTest 미보유)이라 별도 명시. 레이어 의존 아키텍처 가드.
#   - :build-logic:test : included build 라 루트 태스크에 안 묶여 별도 명시. release 키 가드(TestKit) 회귀 가드.
#   - :app:compileDebugAndroidTestKotlin : androidTest 소스셋 컴파일 가드. GMD 스위트는 화·금 정기 실행과
#     `android-test` 라벨 PR 에만 돌아 무거운 emulator 없이도 모든 PR 의 컴파일은 먼저 검증한다.
# lint.yml 과 setup 이 거의 동일하지만 분리 — lint 실패가 test 결과를 가리지 않도록 fail-fast 독립.

# PR 검증은 pr-validation.yml 이 한 번에 부르고, 이 워크플로의 job check 를
# ruleset 에서 required 로 직접 요구한다. concurrency 는 진입점에서 PR 단위로 건다.
#
# 트리거를 workflow_call 하나로 두는 것이 요점이다 — on: pull_request 를 함께 남기면
# 같은 검증과 동일한 이름의 check 가 PR 마다 두 벌씩 돈다.
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve pull request context
        id: pull-request
        env:
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::유효한 pull_request_number 가 필요합니다"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base_ref=$EVENT_BASE_REF
            base_sha=$EVENT_BASE_SHA
            head_sha=$EVENT_HEAD_SHA
          else
            pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            state=$(jq -r '.state' <<< "$pull_request")
            base_ref=$(jq -r '.base.ref' <<< "$pull_request")
            base_sha=$(jq -r '.base.sha' <<< "$pull_request")
            head_sha=$(jq -r '.head.sha' <<< "$pull_request")
            if [ "$state" != "open" ]; then
              echo "::error::PR #$PR_NUMBER 는 열려 있지 않습니다"
              exit 1
            fi
            if [ "$GITHUB_SHA" != "$head_sha" ]; then
              echo "::error::dispatch ref $GITHUB_SHA 가 PR #$PR_NUMBER head $head_sha 와 다릅니다"
              exit 1
            fi
          fi

          {
            echo "base-ref=$base_ref"
            echo "base-sha=$base_sha"
            echo "head-sha=$head_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Fetch pull request history for changed-module coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ steps.pull-request.outputs.base-ref }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          git fetch --no-tags --prune --unshallow origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/kover-base" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/kover-head"

      - name: Run deployment script tests
        run: node --test .github/scripts/*.test.mjs

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run unit tests, androidTest compile guard, and aggregate Kover reports
        run: ./gradlew :koverXmlReportCi :koverHtmlReportCi :konsist:test :build-logic:test :app:compileDebugAndroidTestKotlin --continue --parallel --build-cache

      - name: Upload Kover coverage reports
        id: kover-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kover-jvm-coverage
          path: build/reports/kover/
          if-no-files-found: error
          retention-days: 14

      - name: Summarize changed-module coverage
        if: github.event_name == 'pull_request'
        env:
          KOVER_BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
          KOVER_HEAD_SHA: ${{ steps.pull-request.outputs.head-sha }}
          KOVER_ARTIFACT_URL: ${{ steps.kover-artifact.outputs.artifact-url }}
        run: node .github/scripts/render-kover-summary.mjs

      # 실패한 테스트의 HTML/XML 리포트를 PR artifact 로 보존 — CI 로그에서 stack trace 추적이 빠름.
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-reports
          path: |
            **/build/reports/tests/testDebugUnitTest
            **/build/test-results/testDebugUnitTest
            **/build/reports/tests/test
            **/build/test-results/test
          retention-days: 7
