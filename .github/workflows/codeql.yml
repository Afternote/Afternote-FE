name: CodeQL

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 19 * * 2'
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "현재 ref 와 일치해야 하는 열린 PR 번호. 비우면 전체 분석"
        required: false
        default: 0
        type: number

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # required workflow 자체에 paths-ignore 를 걸면 분석 불필요 PR 의 CodeQL context 가
  # Pending 으로 남는다. 작은 선행 job 이 전체 변경 경로를 확인하고, 아래 required job 을
  # job-level if 로 skipped/success 처리한다. 분류 실패·빈 출력은 전체 분석으로 닫힌다.
  classify-changes:
    name: Classify CodeQL impact
    if: github.event_name == 'pull_request' || inputs.pull_request_number > 0
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      actions_required: ${{ steps.path-scope.outputs.codeql_actions || 'true' }}
      java_kotlin_required: ${{ steps.path-scope.outputs.codeql_java_kotlin || 'true' }}
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve language impact
        id: path-scope
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request_number || github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::유효한 pull_request_number 가 필요합니다"
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            pull_request=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
            state=$(jq -r '.state' <<< "$pull_request")
            head_sha=$(jq -r '.head.sha' <<< "$pull_request")
            head_repository=$(jq -r '.head.repo.full_name' <<< "$pull_request")
            if [ "$state" != "open" ] || [ "$head_repository" != "$GITHUB_REPOSITORY" ]; then
              echo "::error::PR #$PR_NUMBER 는 이 저장소의 열린 PR이 아닙니다"
              exit 1
            fi
            if [ "$GITHUB_SHA" != "$head_sha" ]; then
              echo "::error::dispatch ref $GITHUB_SHA 가 PR #$PR_NUMBER head $head_sha 와 다릅니다"
              exit 1
            fi
            CHANGED_FILES=$(jq -r '.changed_files' <<< "$pull_request")
          elif [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')
          fi

          if ! [[ "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error::PR changed_files 값이 유효하지 않습니다: $CHANGED_FILES"
            exit 1
          fi

          files_json="$RUNNER_TEMP/pull-request-files.json"
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
            > "$files_json"
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node .github/scripts/classify-documentation-changes.mjs \
            "$CHANGED_FILES" < "$files_json" > /dev/null
          env -u GH_TOKEN -u GITHUB_TOKEN \
            node .github/scripts/resolve-pr-impact.mjs "$files_json" \
            | grep '^codeql_' >> "$GITHUB_OUTPUT"

  analyze-actions:
    name: Analyze (actions)
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.actions_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: actions
          build-mode: none

      - name: Analyze and upload CodeQL results
        id: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:actions

      - name: Verify analyzed sources in the CodeQL database
        env:
          CODEQL_BUILD_MODE: none
          CODEQL_DATABASE_LANGUAGE: actions
          CODEQL_DATABASE_LOCATIONS: ${{ steps.analyze.outputs.db-locations }}
          CODEQL_DISPLAY_LANGUAGE: actions
          CODEQL_REQUIRED_PATH_FRAGMENT: .github/workflows/
          CODEQL_SOURCE_EXTENSIONS: .yml,.yaml
        run: node .github/scripts/verify-codeql-database.mjs

  analyze-java-kotlin:
    name: Analyze (java-kotlin)
    needs: classify-changes
    if: ${{ !cancelled() && (needs.classify-changes.result != 'success' || needs.classify-changes.outputs.java_kotlin_required != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Clone repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      # 읽기 전용이다 — push 에서도 쓰지 않는다. 이 job 은 --build-cache 를 쓸 수 없어
      # build-cache-warm.yml 이 develop 에 채운 캐시 키를 빈 엔트리로 선점해서는 안 된다.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: java-kotlin
          build-mode: manual

      # Java/Kotlin extraction observes compiler invocations, so a clean manual build is the
      # contract. Pure JVM modules use classes; Android domains retain explicit debug compilation
      # so a partial migration cannot silently remove them from extraction coverage.
      # FROM-CACHE 로 넘어가면 컴파일러가 실행되지 않아 추출기가 소스를 담지 못한다.
      - name: Compile Android and pure JVM Kotlin sources
        run: >-
          ./gradlew compileDebugSources
          :core:model:classes
          :core:domain:classes
          :feature:afternote:domain:classes
          :feature:mindrecord:domain:compileDebugKotlin
          :feature:onboarding:domain:classes
          :feature:receiver:domain:compileDebugKotlin
          :feature:setting:domain:classes
          :feature:timeletter:domain:compileDebugKotlin
          --no-configuration-cache
          --stacktrace
          --console=plain

      - name: Analyze and upload CodeQL results
        id: analyze
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: /language:java-kotlin

      - name: Verify analyzed sources in the CodeQL database
        env:
          CODEQL_BUILD_MODE: manual
          CODEQL_DATABASE_LANGUAGE: java
          CODEQL_DATABASE_LOCATIONS: ${{ steps.analyze.outputs.db-locations }}
          CODEQL_DISPLAY_LANGUAGE: java-kotlin
          CODEQL_REQUIRED_PATH_FRAGMENT: app/src/main/
          CODEQL_SOURCE_EXTENSIONS: .kt
        run: node .github/scripts/verify-codeql-database.mjs
