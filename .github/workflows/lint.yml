name: Static Analysis (Reviewdog)

# base 필터를 두지 않는다 — base 변경(feat/* → develop)은 pull_request 기본 activity type 에
# 없어 재트리거되지 않으므로, 필터가 있으면 스택 PR 이 검증을 한 번도 거치지 않고 머지된다.
on:
  pull_request:

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    name: Check Code Quality (Ktlint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 캐싱 소유자는 setup-gradle 하나 — setup-java 의 cache: gradle 은 정책 테스트
      # (supply-chain-policy.test.mjs)가 금지한다. wrapper 검증도 여기서 fail-closed.
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Run Ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review # PR 리뷰 댓글로 표시
          android: true # Android 스타일 가이드 준수
          fail_on_error: true # 에러 발견 시 빌드 실패
          level: warning # Warning 이상은 댓글로 표시
          ktlint_version: "1.8.0" # 로컬(libs.versions.toml)과 버전 통일

      # Reviewdog 의 diff 필터는 삭제로 새로 발생한 파일 단위 위반을 놓칠 수 있다.
      # Gradle 검사는 변경 라인과 무관하게 저장소 전체의 ktlint 규칙을 강제한다.
      # --build-cache 는 CI 한정 — gradle.properties 의 org.gradle.caching=false 로컬 기본값은 그대로다 (#996).
      - name: Run full Ktlint check
        run: ./gradlew ktlintCheck --continue --parallel --build-cache

  android-lint:
    name: Check Project Issues (Android Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue --parallel --build-cache

      # 모듈별 lint XML 을 한 파일로 합쳐 Reviewdog 가 :feature/* · :core/* 위반도
      # PR 인라인 코멘트로 띄우도록 한다. 이전엔 :app XML 한 개만 전달돼 다른 모듈 위반이
      # Actions step 로그(수만 줄)에 묻혔다.
      - name: Merge module lint XMLs into one
        if: always()
        run: |
          set -e
          out=app/build/reports/lint-results-merged.xml
          mkdir -p app/build/reports
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<issues format="6" by="lint" client="gradle" type="baseline" name="merged">'
            find . -path '*/build/reports/lint-results-debug.xml' -print | while read -r xml; do
              xmllint --xpath '//issue' "$xml" 2>/dev/null || true
            done
            echo '</issues>'
          } > "$out"
          modules=$(find . -path '*/build/reports/lint-results-debug.xml' | wc -l)
          issues=$(grep -c '<issue ' "$out" || echo 0)
          echo "merged $issues issues from $modules modules → $out"

      - name: Report Android Lint (Reviewdog)
        if: always()
        uses: dvdandroid/action-android-lint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          lint_xml_file: app/build/reports/lint-results-merged.xml
