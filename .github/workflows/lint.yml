name: Static Analysis (Reviewdog)

# base 필터를 두지 않는다 — base 변경(feat/* → develop)은 pull_request 기본 activity type 에
# 없어 재트리거되지 않으므로, 필터가 있으면 스택 PR 이 검증을 한 번도 거치지 않고 머지된다.
on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    name: Check Code Quality (Ktlint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Run Ktlint
        uses: ScaCap/action-ktlint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review # PR 리뷰 댓글로 표시
          android: true # Android 스타일 가이드 준수
          fail_on_error: true # 에러 발견 시 빌드 실패
          level: warning # Warning 이상은 댓글로 표시
          ktlint_version: "1.8.0" # 로컬(libs.versions.toml)과 버전 통일

      # Reviewdog 의 diff 필터는 삭제로 새로 발생한 파일 단위 위반을 놓칠 수 있다.
      # Gradle 검사는 변경 라인과 무관하게 저장소 전체의 ktlint 규칙을 강제한다.
      - name: Run full Ktlint check
        run: ./gradlew ktlintCheck --continue --parallel

  android-lint:
    name: Check Project Issues (Android Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      # fail-fast — secret 누락 시 Gradle 까지 가지 않고 즉시 실패
      # secret 값은 echo 하지 않음 (env 로만 받아서 길이 검사). 누락 키 이름은 안전.
      - name: Verify required secrets are set
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          missing=""
          [ -z "$KAKAO_NATIVE_APP_KEY" ] && missing="$missing KAKAO_NATIVE_APP_KEY"
          [ -z "$GOOGLE_WEB_CLIENT_ID" ] && missing="$missing GOOGLE_WEB_CLIENT_ID"
          [ -z "$GOOGLE_SERVICES_JSON_B64" ] && missing="$missing GOOGLE_SERVICES_JSON_B64"
          if [ -n "$missing" ]; then
            echo "::error::필수 secret 누락:$missing — Settings → Secrets and variables → Actions 에 등록"
            exit 1
          fi

      # google-services plugin 이 app/google-services.json 을 요구. 파일은 .gitignore 라
      # CI 환경엔 없음. base64 인코딩된 secret 으로 받아서 decode.
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue --parallel
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      # 모듈별 lint XML 을 한 파일로 합쳐 Reviewdog 가 :feature/* · :core/* 위반도
      # PR 인라인 코멘트로 띄우도록 한다. 이전엔 :app XML 한 개만 전달돼 다른 모듈 위반이
      # Actions step 로그(수만 줄)에 묻혔다.
      - name: Merge module lint XMLs into one
        if: always()
        run: |
          set -e
          out=app/build/reports/lint-results-merged.xml
          mkdir -p app/build/reports
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<issues format="6" by="lint" client="gradle" type="baseline" name="merged">'
            find . -path '*/build/reports/lint-results-debug.xml' -print | while read -r xml; do
              xmllint --xpath '//issue' "$xml" 2>/dev/null || true
            done
            echo '</issues>'
          } > "$out"
          modules=$(find . -path '*/build/reports/lint-results-debug.xml' | wc -l)
          issues=$(grep -c '<issue ' "$out" || echo 0)
          echo "merged $issues issues from $modules modules → $out"

      - name: Report Android Lint (Reviewdog)
        if: always()
        uses: dvdandroid/action-android-lint@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          lint_xml_file: app/build/reports/lint-results-merged.xml
