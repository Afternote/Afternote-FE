name: Static Analysis (Reviewdog)

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  ktlint:
    name: Check Code Quality (Ktlint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      # ScaCap 의 reviewdog wrapper 는 사용하지 않는다 — bot 가 PR 인라인 코멘트·Reviewers 사이드바·알림을
      # 만들어 시끄럽고, 본 repo 는 pre-commit 훅의 ktlint(staged 파일만) + CI 의 fail/pass 결과만 가지고
      # 머지 게이트를 운영한다. ktlint 1.8.0 standalone binary 만 호출 — 위반 시 step 자체가 fail.
      - name: Run Ktlint
        run: |
          set -e
          KTLINT_VERSION="1.8.0"
          curl -fsSLo /tmp/ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x /tmp/ktlint
          /tmp/ktlint --relative

  android-lint:
    name: Check Project Issues (Android Lint)
    runs-on: ubuntu-latest
    steps:
      - name: Clone repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      # fail-fast — secret 누락 시 Gradle 까지 가지 않고 즉시 실패
      # secret 값은 echo 하지 않음 (env 로만 받아서 길이 검사). 누락 키 이름은 안전.
      - name: Verify required secrets are set
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          missing=""
          [ -z "$KAKAO_NATIVE_APP_KEY" ] && missing="$missing KAKAO_NATIVE_APP_KEY"
          [ -z "$GOOGLE_WEB_CLIENT_ID" ] && missing="$missing GOOGLE_WEB_CLIENT_ID"
          if [ -n "$missing" ]; then
            echo "::error::필수 secret 누락:$missing — Settings → Secrets and variables → Actions 에 등록"
            exit 1
          fi

      - name: Run Android Lint
        run: ./gradlew lintDebug --continue --parallel
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      # Android Lint 결과 reporter 도 폐기 — bot 코멘트/Annotations/Reviewers 사이드바 전부 X.
      # `./gradlew lintDebug` 자체가 위반 시 non-zero exit → 위 step 이 fail 하면 CI 빨간 X 만 남음.
      # 사용자는 Actions step 로그(또는 로컬 lintDebug) 로 위치 확인.