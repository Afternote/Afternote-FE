name: Repository Quality

# PR 에서는 pr-validation.yml 이 부른다. develop·main push 는 여기서 직접 돈다 (#848).
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: false
        default: 0
        type: number
  push:
    branches: [develop, main]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: repository-quality-${{ github.workflow }}-${{ inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-quality:
    name: Repository Quality
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # GitHub 의 server-side paths 평가는 유한한 diff 앞부분만 보므로, 그 경계를 넘는 PR 을
      # 그대로 허용하면 뒤쪽 dependency 파일이 graph/review workflow 를 우회할 수 있다.
      # 공식 문서의 상충하는 300/3,000 한도 중 보수적인 300을 fail-closed 경계로 쓴다.
      - name: Guard server-side path filter boundary
        if: inputs.pull_request_number > 0
        env:
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GH_TOKEN: ${{ github.token }}
          MAX_PATH_FILTER_FILES: 300
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail

          if [ -z "$CHANGED_FILES" ]; then
            CHANGED_FILES=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.changed_files')
          fi

          if ! [[ "$CHANGED_FILES" =~ ^[0-9]+$ ]]; then
            echo "::error::PR changed_files 값이 유효하지 않습니다: $CHANGED_FILES"
            exit 1
          fi

          if (( CHANGED_FILES > MAX_PATH_FILTER_FILES )); then
            echo "::error::PR 변경 파일 ${CHANGED_FILES}개가 paths 안전 경계 ${MAX_PATH_FILTER_FILES}개를 초과했습니다. PR을 분리하세요."
            exit 1
          fi

      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require linked Issue
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/validate-pr-issue-link.mjs

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_LINUX_AMD64_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail

          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="${RUNNER_TEMP}/${archive}"
          tool_directory="${RUNNER_TEMP}/actionlint-${ACTIONLINT_VERSION}"
          mkdir -p "$tool_directory"

          curl --fail --location --silent --show-error \
            --output "$archive_path" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive_path" \
            | sha256sum --check --strict
          tar -xzf "$archive_path" -C "$tool_directory"
          printf '%s\n' "$tool_directory" >> "$GITHUB_PATH"

      - name: Run repository quality checks
        run: scripts/repository-quality.sh

      - name: Verify failing fixtures
        run: scripts/test-repository-quality.sh
