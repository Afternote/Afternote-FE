# 오래된 브랜치의 inline guard가 끝나도 최신 default-branch 정책으로 최종 결과를 갱신한다.
# PR 코드를 checkout/실행하지 않으며, workflow_dispatch 결과는 재호출하지 않는다.
name: Refresh merge-order policy

on:
  workflow_run:
    workflows: [merge-order-guard]
    types: [completed]

permissions: {}

jobs:
  refresh:
    if: github.event.workflow_run.event == 'pull_request'
    permissions:
      actions: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch latest policy for matching open PRs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --state open --head "$HEAD_BRANCH" --limit 100 --json number,headRefOid)
          numbers=$(jq -r --arg sha "$HEAD_SHA" '.[] | select(.headRefOid == $sha) | .number' <<< "$prs")
          failed=0
          for pr in $numbers; do
            if ! gh workflow run merge-order-guard.yml --ref "$DEFAULT_BRANCH" -f pull_request_number="$pr"; then
              echo "::error::PR #$pr 최신 머지 가드 실행 요청 실패"
              failed=1
            fi
          done
          exit "$failed"
