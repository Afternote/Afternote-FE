name: Dependency Review

# PR 에서는 pr-validation.yml 이 매번 부른다 (#2258). 예전에는 의존성 파일 paths 필터로
# 직접 pull_request 를 들었는데, 그러면 소스만 고친 PR 에 check 가 생기지 않아 ruleset 의
# required context 로 걸 수 없었다. 이제 repository-quality 가 같은 경로 목록으로 변경을
# 분류하고, 의존성 입력이 없으면 아래 job 이 검사 스텝만 건너뛴 채 성공한다. 분류가
# 실패하면 호출자가 run_review 를 true 로 넘겨 검사 쪽으로 닫힌다.
#
# 검사는 pull_request 이벤트에서만 한다. merge group 과 bridge dispatch 커밋에는
# dependency-submission.yml 이 PR 스냅샷을 만들지 않아 비교할 head 가 없다. 그 SHA 의
# 의존성은 이미 각 PR head 에서 이 검사를 통과한 것들의 병합이다.
on:
  workflow_call:
    inputs:
      run_review:
        description: "의존성 그래프 입력이 바뀌어 검사가 필요한지 여부"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Record why dependency review is skipped
        if: ${{ !(inputs.run_review && github.event_name == 'pull_request') }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_REVIEW: ${{ inputs.run_review }}
        run: |
          if [ "$RUN_REVIEW" != "true" ]; then
            echo "::notice::의존성 그래프 입력이 바뀌지 않아 Dependency Review 를 건너뜁니다."
          else
            echo "::notice::$EVENT_NAME 이벤트에는 비교할 PR 스냅샷이 없어 Dependency Review 를 건너뜁니다."
          fi

      # PR snapshot 은 두 workflow 를 거쳐 API 에 올라온다 (fork PR 을 checkout 하지 않기 위한 분리다).
      #   1. Generate PR Dependency Graph — PR context 에서 artifact 만 만든다.
      #   2. Submit PR Dependency Graph   — trusted workflow_run 에서 artifact 를 제출한다.
      # 이 job 은 1번과 동시에 출발하므로 제출이 끝날 때까지 snapshot warning 을 재시도한다.
      - name: Fail on newly introduced high-severity vulnerabilities
        if: ${{ inputs.run_review && github.event_name == 'pull_request' }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-scopes: runtime, development, unknown
          fail-on-severity: high
          license-check: true
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 1200
