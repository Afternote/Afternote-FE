name: Base Freshness Publisher

# workflow_run은 default branch의 검토된 정의로 실행된다. PR head의 코드는 checkout하거나
# 실행하지 않고 GitHub API의 live base/head 관계만 판정한다. develop/main push는 지연을
# 줄이기 위해 trusted branch에서 바로 처리하고, 스택 base push는 probe bridge가 처리한다.
on:
  workflow_run:
    workflows: ["Base Freshness Probe"]
    types: [completed]
  push:
    branches: [develop, main]

concurrency:
  # 모든 이벤트를 한 trusted publisher로 직렬화한다. PR 신호와 base-push 신호가
  # 동시에 같은 head의 status를 쓰면 오래된 base 기준 success가 최신 failure를
  # 나중에 덮을 수 있다. Actions는 같은 group의 pending run을 하나만 보존하므로,
  # 각 실행은 event 대상만이 아니라 모든 열린 PR의 live 관계를 다시 판정한다.
  group: base-freshness-publisher
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Publish live base status
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Clone trusted freshness policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Test freshness policy
        run: node --test .github/scripts/evaluate-base-freshness.test.mjs

      - name: Publish Base Freshness status
        env:
          BASE_FRESHNESS_MODE: publish
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/evaluate-base-freshness.mjs
