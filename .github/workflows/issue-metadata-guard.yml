name: Issue Metadata Guard

on:
  issues:
    types: [opened, reopened, edited, assigned, unassigned, labeled, unlabeled]
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: issue-metadata-${{ github.event.issue.number || github.event_name }}
  cancel-in-progress: false

jobs:
  enforce:
    name: Enforce assignee, type, area labels, and bug priority field
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - name: Clone trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Verify metadata policy tests
        run: node --test .github/scripts/reconcile-issue-metadata.test.mjs

      - name: Reconcile issue metadata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/reconcile-issue-metadata.mjs
