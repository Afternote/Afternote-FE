name: API Wire Contract Smoke

on:
  pull_request:
    paths:
      - 'core/network/**'
      - 'core/common/**'
      - 'core/domain/**'
      - 'core/model/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/api-contract-smoke.yml'
  push:
    branches: [develop]
    paths:
      - 'core/network/**'
      - 'core/common/**'
      - 'core/domain/**'
      - 'core/model/**'
      - 'build-logic/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/api-contract-smoke.yml'
  schedule:
    - cron: '41 18 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-wire-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract-smoke:
    name: Retrofit HTTP contract through Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_API_CONTRACT_SMOKE: 'true'
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Require Docker runtime
        run: docker info

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run Retrofit wire contract smoke
        run: >-
          ./gradlew :core:network:testDebugUnitTest
          --tests '*ApiWireContractSmokeTest'
          --stacktrace

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-wire-contract-reports-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          # 표준 보관 기간 7일 — 리포트·디버깅용 artifact 는 이 값 하나로 통일한다 (#1400).
          retention-days: 7
          path: |
            core/network/build/reports/tests/testDebugUnitTest/
            core/network/build/test-results/testDebugUnitTest/
