name: Android Managed Device Test

# 모든 PR 에서는 pr-validation.yml 이 reusable workflow 로 호출해 정확한 head SHA 를 검사한다.
# 수동·정기 실행은 default branch 만 검사해 runner·SDK 변화에 따른 주기적 회귀도 확인한다.
# 실패를 감추는 job/test 재시도는 두지 않는다.
on:
  workflow_call:
    inputs:
      pull_request_number:
        required: false
        default: 0
        type: number
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 2,5"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-managed-device-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

jobs:
  managed-device:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_dispatch' &&
       (inputs.pull_request_number > 0 || github.ref_name == github.event.repository.default_branch))
    name: Pixel 2 API 30 androidTest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Record tested revision
        env:
          TARGET_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          TARGET_PR: ${{ inputs.pull_request_number || github.event.pull_request.number || 'none' }}
          TARGET_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "## Android Managed Device target"
            echo
            echo "- PR: $TARGET_PR"
            echo "- Branch: \`$TARGET_BRANCH\`"
            echo "- Commit: \`$TARGET_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Enable and verify KVM access
        run: |
          runner_user="$(id -un)"
          echo "KERNEL==\"kvm\", OWNER=\"${runner_user}\", GROUP=\"kvm\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle

          id
          ls -l /dev/kvm
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm must be a character device readable and writable by the runner"
            exit 1
          fi
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "emulator"
          "${ANDROID_HOME}/emulator/emulator" -accel-check

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run managed-device androidTest
        run: |
          ./gradlew pixel2Api30DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace

      - name: Upload androidTest reports and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-managed-device-results-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
