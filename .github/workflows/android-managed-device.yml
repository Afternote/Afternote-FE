name: Android Managed Device Test

# PR 필수 검증으로 올리기 전 안정화 단계다. 수동 실행과 정기 실행의 최근 3회가 연속
# 성공했는지는 별도 gate 이슈에서 판단하며, 실패를 감추는 job/test 재시도는 두지 않는다.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 2,5"

permissions:
  contents: read

concurrency:
  group: android-managed-device-${{ github.ref }}
  cancel-in-progress: false

jobs:
  managed-device:
    name: Pixel 2 API 30 androidTest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Clone repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          cache-read-only: true
          validate-wrappers: true

      - name: Enable and verify KVM access
        run: |
          runner_user="$(id -un)"
          echo "KERNEL==\"kvm\", OWNER=\"${runner_user}\", GROUP=\"kvm\", MODE=\"0660\", OPTIONS+=\"static_node=kvm\"" \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm --settle

          id
          ls -l /dev/kvm
          if [[ ! -c /dev/kvm || ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::/dev/kvm must be a character device readable and writable by the runner"
            exit 1
          fi
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "emulator"
          "${ANDROID_HOME}/emulator/emulator" -accel-check

      - name: Set up CI-only app configuration
        uses: ./.github/actions/setup-ci-config

      - name: Run managed-device androidTest
        run: |
          ./gradlew pixel2Api30DebugAndroidTest \
            -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect \
            --stacktrace

      - name: Upload androidTest reports and failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-managed-device-results-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            app/build/reports/androidTests/managedDevice/
            app/build/outputs/androidTest-results/managedDevice/
            app/build/outputs/managed_device_android_test_additional_output/
