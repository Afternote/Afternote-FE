name: PR Validation

# PR 검증의 유일한 진입점이다. static analysis · unit test · screenshot · repository quality ·
# Android Managed Device 를 reusable workflow 로 한 번씩 부르고, 각 job check 를 ruleset 에서
# 직접 required 로 요구한다. 모든 검증 뒤 집계용 runner 를 한 번 더 기다리지 않는다.
# required context 이름은 pr-gate-policy.test.mjs 에 고정해 workflow 이름 변경과 ruleset
# 변경이 함께 검토되도록 한다.
#
# base 필터를 두지 않는다 — base 변경(feat/* → develop)은 pull_request 기본 activity
# type 에 없어 재트리거되지 않으므로, 필터가 있으면 스택 PR 이 검증을 한 번도 거치지
# 않고 머지된다.
on:
  pull_request:
  # GITHUB_TOKEN 으로 PR 브랜치에 baseline/stack merge commit 을 올리면 pull_request
  # 이벤트가 다시 발생하지 않는다. 권한 있는 bridge 가 같은 SHA 에 필수 검증을 붙일 때 쓴다.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "현재 ref 와 일치해야 하는 열린 PR 번호"
        required: true
        type: number

# 같은 PR 의 옛 실행을 끊는다. head 가 갱신되면 이전 SHA 의 결과는 판단 근거가 아니다.
concurrency:
  group: pr-validation-${{ github.event.pull_request.number || inputs.pull_request_number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  static-analysis:
    name: Static Analysis
    uses: ./.github/workflows/lint.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number || github.event.pull_request.number }}

  unit-test:
    name: Unit Test
    uses: ./.github/workflows/unit-test.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number || github.event.pull_request.number }}

  screenshot:
    name: Screenshot
    uses: ./.github/workflows/screenshot.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number || github.event.pull_request.number }}

  repository-quality:
    name: Repository Quality
    uses: ./.github/workflows/repository-quality.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number || github.event.pull_request.number }}

  android-managed-device:
    name: Android Managed Device
    uses: ./.github/workflows/android-managed-device.yml
    with:
      pull_request_number: ${{ inputs.pull_request_number || github.event.pull_request.number }}
