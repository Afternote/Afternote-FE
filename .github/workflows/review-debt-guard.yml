# 리뷰 적체 가드 (#1136)
#
# 리뷰 요청을 받아 놓고 처리하지 않는 사람이 새 PR 을 계속 여는 것을 막는다.
# GitHub 네이티브에는 PR 생성을 막는 수단이 없어(ruleset·branch protection 은
# push·merge 만 통제) 열린 직후 조회해 미처리 리뷰 요청이 1건이라도 있으면
# 그 PR 을 닫는다. 브랜치는 남으므로 리뷰를 끝낸 뒤 되살릴 수 있다.
#
# 우회가 설계에 남아 있다 — #796 에서 자동 reviewer 요청을 없애 리뷰 요청은
# 전부 수동이고, 리뷰어가 자기에게 걸린 요청을 스스로 떼면 이 가드를 통과한다.
# 막지는 못하므로 review_request_removed 를 함께 받아 기록만 남긴다.
name: review-debt-guard

on:
  pull_request:
    types: [opened, reopened, ready_for_review, review_request_removed]

permissions:
  pull-requests: write

jobs:
  debt-check:
    if: github.event.action != 'review_request_removed'
    runs-on: ubuntu-latest
    steps:
      - name: 미처리 리뷰 요청 검사
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          ASSOCIATION: ${{ github.event.pull_request.author_association }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          # 조회 실패를 "빚 없음" 으로 오인해 통과시키지 않는다. 다만 판정 근거를
          # 얻지 못한 상태로 남의 PR 을 닫지도 않는다 — 아래에서 명시적으로 나눈다.
          set -euo pipefail

          # 봇 PR 은 대상이 아니다.
          case "$AUTHOR" in
            *'[bot]'|dependabot|github-actions) echo "봇 PR — 건너뜀"; exit 0 ;;
          esac

          # 외부 기여자는 대상이 아니다. fork PR 은 토큰이 read-only 라
          # 닫지도 못하고, 팀 리뷰 적체와도 무관하다.
          case "$ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR) ;;
            *) echo "외부 기여자($ASSOCIATION) — 건너뜀"; exit 0 ;;
          esac

          # 긴급 우회 라벨.
          case ",$LABELS," in
            *,review-debt-exempt,*) echo "review-debt-exempt 라벨 — 건너뜀"; exit 0 ;;
          esac

          # 작성자에게 걸린 리뷰 요청. 자기가 만든 PR 은 자신이 리뷰어가 될 수
          # 없으므로 이 검색에 잡히지 않는다. --paginate 없이는 30건에서 잘린다.
          if ! requested=$(gh api -X GET search/issues \
                -f q="is:open is:pr repo:$REPO review-requested:$AUTHOR" --paginate \
                --jq '.items[] | "\(.number)\t\(.created_at[0:10])\t\(.title)"'); then
            echo "::error::리뷰 요청 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다. 재실행할 것"
            exit 1
          fi

          # 요청이 걸렸다고 다 빚은 아니다. 두 가지를 걸러낸다.
          #
          # 1. «누가» 봤는지는 따지지 않는다. PR 하나에 필요한 리뷰는 한 건이므로,
          #    다른 사람이 이미 판정을 냈으면 내 몫은 끝난 것으로 본다. 요청을
          #    전원에게 거는 것은 «누구든 먼저 보라» 는 뜻이지 «둘 다 보라» 가 아니다.
          # 2. 병합 커밋은 «새 코드» 로 치지 않는다. develop 전파만 쌓인 PR 이
          #    미리뷰로 잡히면, 이미 승인해 둔 스택 PR 이 통째로 빚이 된다.
          #    parents 가 둘 이상인 커밋을 빼고 마지막 실질 변경 시각을 잡는다.
          debt_file=$(mktemp)
          while IFS=$'\t' read -r pn created title; do
            [ -n "$pn" ] || continue

            changed_at=$(gh api "repos/$REPO/pulls/$pn/commits?per_page=100" --paginate \
              --jq '[.[] | select((.parents | length) < 2)] | last | .commit.committer.date' 2>/dev/null || true)
            [ -n "$changed_at" ] && [ "$changed_at" != "null" ] || changed_at="1970-01-01T00:00:00Z"

            judged=$(gh api "repos/$REPO/pulls/$pn/reviews" --paginate \
              --jq "[.[] | select(.submitted_at > \"$changed_at\") | select(.state == \"APPROVED\" or .state == \"CHANGES_REQUESTED\")] | length" 2>/dev/null || true)

            if [ "${judged:-0}" -eq 0 ]; then
              printf '%s\t%s\t%s\n' "$pn" "$created" "$title" >> "$debt_file"
            else
              echo "#$pn — 최신 코드에 이미 판정이 있음(${judged}건), 빚 아님"
            fi
          done <<< "$requested"

          if [ ! -s "$debt_file" ]; then
            echo "미처리 리뷰 요청 없음 — 통과"
            exit 0
          fi

          debt=$(cat "$debt_file")
          count=$(wc -l < "$debt_file" | tr -d ' ')
          today=$(date -u +%s)

          {
            echo "## 🚧 리뷰 적체 가드 — 이 PR 을 닫습니다"
            echo
            echo "@$AUTHOR 님이 아직 처리하지 않은 리뷰 요청이 **${count}건** 있습니다."
            echo
            echo "| PR | 열린 날 | 경과 | 제목 |"
            echo "|---|---|---|---|"
            while IFS=$'\t' read -r n created title; do
              [ -n "$n" ] || continue
              opened=$(date -u -d "$created" +%s 2>/dev/null || echo "$today")
              days=$(( (today - opened) / 86400 ))
              echo "| #$n | $created | ${days}일 | $title |"
            done <<< "$debt"
            echo
            echo "이 저장소는 미처리 리뷰 요청이 1건이라도 있으면 새 PR 을 열 수 없습니다 (#1136)."
            echo
            echo "각 PR 에 필요한 리뷰는 **한 건**입니다 — 다른 사람이 먼저 판정을 내면 그 PR 은 목록에서 빠집니다."
            echo
            echo "### 되살리는 법"
            echo
            echo "위 리뷰를 끝낸 뒤 이 PR 을 다시 여세요. **브랜치는 지워지지 않았고 커밋도 그대로입니다.**"
            echo
            echo '```bash'
            echo "gh pr reopen $PR_NUMBER"
            echo '```'
            echo
            echo "리뷰보다 이 PR 이 급하면 \`review-debt-exempt\` 라벨을 붙이고 다시 열면 통과합니다."
          } > /tmp/debt-comment.md

          echo "미처리 ${count}건 — PR #$PR_NUMBER 를 닫는다"
          gh pr close "$PR_NUMBER" --repo "$REPO" --comment "$(cat /tmp/debt-comment.md)"

  bypass-audit:
    # 리뷰를 남기지 않은 채 요청이 제거되면 이 가드는 그냥 통과한다.
    # 막을 수단이 없으니 드러나게만 한다.
    if: github.event.action == 'review_request_removed'
    runs-on: ubuntu-latest
    steps:
      - name: 리뷰 없는 요청 제거 기록
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REMOVED: ${{ github.event.requested_reviewer.login }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          set -euo pipefail

          # 팀 리뷰 요청 제거만 본다.
          [ -n "$REMOVED" ] || { echo "리뷰어 정보 없음 — 건너뜀"; exit 0; }

          reviewed=$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" \
            --jq "[.[] | select(.user.login == \"$REMOVED\")] | length")

          if [ "$reviewed" -gt 0 ]; then
            echo "$REMOVED 는 이미 리뷰를 남겼다 — 정상 제거"
            exit 0
          fi

          if [ "$SENDER" = "$REMOVED" ]; then
            note="리뷰어 본인이 직접 뗐습니다 — 리뷰 적체 가드(#1136)를 통과하게 됩니다."
          else
            note="@$SENDER 님이 제거했습니다."
          fi

          gh pr comment "$PR_NUMBER" --repo "$REPO" --body \
            "🔍 **리뷰 없이 요청이 제거됨** — @$REMOVED 님은 이 PR 에 리뷰를 남기지 않은 상태입니다. $note"
