# 리뷰 적체 가드 (#1136)
#
# 리뷰 요청을 처리하지 않거나 자기 PR 의 변경요청에 응답하지 않은 사람이 새 PR 을
# 계속 여는 것을 막는다.
# GitHub 네이티브에는 PR 생성을 막는 수단이 없어(ruleset·branch protection 은
# push·merge 만 통제) 열린 직후 조회해 미처리 리뷰 요청이 1건이라도 있으면
# 그 PR 을 닫는다. 브랜치는 남으므로 리뷰를 끝낸 뒤 되살릴 수 있다.
#
# 리뷰어 빚의 기준은 «나에게 걸린 리뷰 요청» 이 아니라 «아무도 응답하지 않은 열린
# PR» 이다(#1148). 다만 한번 변경요청을 남긴 뒤에는 작성자가 그 리뷰어에게 명시적으로
# 재요청해야만 공이 돌아온다. 수정 커밋만으로 리뷰 의무를 만들지는 않는다(#1136).
# 작성자 빚은 같은 작성자의 다른 열린 PR 이 최신 변경요청 뒤 실질 커밋·응답·작성자
# 본문 편집 없이 남은 상태다. 라벨 갱신 시점에 기대지 않고 새 PR 을 열 때 현재 상태를
# 다시 계산한다(#1679, #1700).
name: review-debt-guard

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  debt-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 게이트 스크립트는 **default branch 사본**으로 돌린다. PR 사본을 체크아웃하면 PR 이
      # 자기를 검사하는 가드를 고쳐 통과시킬 수 있다. 필요한 건 .github/scripts 뿐이라
      # sparse-checkout 으로 좁힌다.
      - name: Clone gate scripts from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # 한도가 바닥인 채로 들어가면 게이트가 코드와 무관하게 빨개진다. 남은 quota 를 요약에
      # 남기고, 부족하면 리셋까지 기다린다 — 즉시 실패시키면 사람이 재실행을 걸고 그 재실행이
      # 남은 quota 를 더 태운다 (#1465).
      - name: Ensure GitHub API quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # default branch 사본에 이 스크립트가 아직 없는 동안(= 스크립트를 심는 이 PR 자신)에는
          # 건너뛴다. 머지 뒤에는 항상 존재하므로 이 경로는 부트스트랩 한 번에만 쓰인다.
          if [ ! -f .github/scripts/ensure-api-quota.mjs ]; then
            echo "::notice::quota 스크립트가 default branch 에 아직 없습니다 — 건너뜁니다"
            exit 0
          fi
          # 두 자원을 순차 확인하므로 각각의 대기 상한을 절반 이하로 잡아 job 의 5분
          # timeout 안에 판정 로그까지 남긴다(내부 +5초 경계 여유를 포함해 최대 240초).
          node .github/scripts/ensure-api-quota.mjs ensure --resource core --max-wait 115
          node .github/scripts/ensure-api-quota.mjs ensure --resource graphql --max-wait 115

      - name: 리뷰·작성자 응답 빚 검사
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          # PR 제한·awaiting-author 라벨의 공통 면제 목록 (#1910, #1934).
          # 라벨러도 이 선언을 읽는다. 인용·주석 없는 한 줄에서 공백으로 구분한다.
          REVIEW_GATE_EXEMPT_AUTHORS: koongmai
        run: |
          # 조회 실패를 "빚 없음" 으로 오인해 통과시키지 않는다. 다만 판정 근거를
          # 얻지 못한 상태로 남의 PR 을 닫지도 않는다 — 아래에서 명시적으로 나눈다.
          set -euo pipefail

          # 봇 PR 은 대상이 아니다.
          case "$AUTHOR" in
            *'[bot]'|dependabot|github-actions) echo "봇 PR — 건너뜀"; exit 0 ;;
          esac

          # fork PR 은 대상이 아니다 — 토큰이 read-only 라 닫지도 못하고, 팀 리뷰
          # 적체와도 무관하다. 원래 걸러내려던 것이 이것이므로 head 저장소로 가른다.
          if [ "$HEAD_REPO" != "$REPO" ]; then
            echo "fork PR($HEAD_REPO) — 건너뜀"
            exit 0
          fi

          # 팀원 여부는 author_association 으로 가리지 않는다. 웹훅 페이로드는 조직
          # 멤버십이 비공개면 MEMBER 대신 CONTRIBUTOR 를 내리는데 이 조직은 공개
          # 멤버가 0명이다. 그래서 레포에 직접 초대된 한 계정만 COLLABORATOR 로 찍혀
          # 검사를 받고, 나머지 팀원은 전원 «외부 기여자» 로 건너뛰어졌다 — 8/25 에
          # #1152·#1154 가 그렇게 통과했고 12분 뒤 같은 빚으로 #1112 만 닫혔다.
          # REST 로 조회하면 MEMBER 로 보여 눈으로는 잡히지 않는다. 실권한을 묻는다.
          if ! perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" --jq '.permission'); then
            echo "::error::권한 조회에 실패했다 — 근거 없이 통과시키지 않는다. 재실행할 것"
            exit 1
          fi

          # 빈 값·예상 밖 값을 «권한 없음» 으로 접으면 조회 실패가 통과로 둔갑한다.
          case "$perm" in
            admin|maintain|write) ;;
            read|none) echo "쓰기 권한 없음($perm) — 건너뜀"; exit 0 ;;
            *) echo "::error::권한 값을 알 수 없다($perm) — 재실행할 것"; exit 1 ;;
          esac

          # 이 가드 자체를 면제받은 작성자 (#1910). 팀이 koongmai 에게는 PR 을 여는 시점의
          # 제약을 두지 않고 머지 시점 제약만 남기기로 했다. 리뷰 지적을 반영했는지와 무관하게
          # 새 PR 을 열 수 있고, 남의 PR 을 리뷰할 의무도 없어 review-request-all 의 TEAM 에서도
          # 빠져 있다. 머지 게이트는 그대로다. develop 은 여전히 승인 1건과 필수 체크를 요구하고,
          # 그 요건은 이 가드가 아니라 required-approval·required-checks 룰셋이 건다.
          #
          # 면제는 "빚 계산" 앞에 둔다. 뒤에 두면 면제받은 사람의 PR 때문에 조회가 실패했을 때
          # 가드가 그를 대신해 죽는다. GitHub 로그인은 대소문자를 가리지 않으므로 낮춰 비교한다.
          author_lc=$(printf '%s' "$AUTHOR" | tr '[:upper:]' '[:lower:]')
          exempt_lc=$(printf '%s' "$REVIEW_GATE_EXEMPT_AUTHORS" | tr '[:upper:]' '[:lower:]')
          case " $exempt_lc " in
            *" $author_lc "*) echo "리뷰 게이트 면제 작성자($AUTHOR) — 건너뜀"; exit 0 ;;
          esac

          # 빚의 기준은 «나에게 요청이 걸렸는가» 가 아니라 «아무도 응하지 않은 PR 이
          # 남아 있는가» 다. 리뷰 요청은 알림 수단이지 담당 배정이 아니다 —
          # 누구에게 걸렸든 팀에서 한 사람이 보면 그 PR 의 리뷰는 끝난 것이다.
          # 그래서 요청 목록이 아니라 열린 PR 전체를 훑는다.
          #
          # 자기 PR 은 자신이 리뷰할 수 없으므로 뺀다. draft 는 리뷰를 받을 상태가
          # 아니므로 뺀다(review-request-all 도 draft 에는 요청을 걸지 않는다).
          if ! open_prs=$(gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate \
                --jq ".[] | select(.draft == false) | select(.user.login != \"$AUTHOR\")
                           | \"\(.number)\t\(.created_at[0:10])\t\(.user.login)\t\([.requested_reviewers[].login | ascii_downcase] | join(\",\"))\t\(.title)\""); then
            echo "::error::열린 PR 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다. 재실행할 것"
            exit 1
          fi
          repo_owner=${REPO%%/*}
          repo_name=${REPO#*/}

          # 같은 작성자의 다른 PR 에 공이 남아 있는지도 실시간으로 다시 계산한다. 기존
          # `awaiting-author` 라벨만 보면 리컨사일 주기와 이 실행이 엇갈릴 때 방금 붙거나
          # 떨어진 상태를 놓친다. 라벨 리컨사일러와 같은 judgeAwaitingAuthor 술어를 쓰되,
          # 현재 막 열려 판정 리뷰가 없는 PR 자신은 번호로 명시적으로 제외한다.
          author_debt_file=$(mktemp)
          if [ -f .github/scripts/check-author-debt.mjs ]; then
            GITHUB_TOKEN="$GH_TOKEN" \
            GITHUB_REPOSITORY="$REPO" \
            AUTHOR="$AUTHOR" \
            CURRENT_PULL_REQUEST_NUMBER="$PR_NUMBER" \
            AUTHOR_DEBT_FILE="$author_debt_file" \
              node .github/scripts/check-author-debt.mjs
          else
            # default branch 에 스크립트를 심는 이 PR 자신에게는 아직 사본이 없다. 머지
            # 뒤에는 항상 존재하므로 부트스트랩 한 번만 작성자 빚 검사를 건너뛴다.
            echo "::notice::작성자 빚 스크립트가 default branch 에 아직 없습니다 — 건너뜁니다"
            : > "$author_debt_file"
          fi

          # 남은 것에서 «리뷰어의 공이 아닌» PR 을 걸러낸다. «누가» 봤는지는 따지지
          # 않는다 — 팀에서 한 사람이 더 늦은 판정을 내리면 그 판정이 PR 의 현재
          # 상태다. 더 오래된 다른 리뷰어의 변경요청을 다시 빚으로 살리지 않는다.
          #
          # 승인과 변경요청은 무게가 다르다.
          #   APPROVED        머지 가능한 상태다. 그 뒤에 작성자가 손보는 것은
          #                   작성자 몫이고, 다시 봐 줄 의무는 누구에게도 없다.
          #   CHANGES_REQUESTED  아직 끝난 판정이 아니다. 다만 수정 커밋만으로 리뷰
          #                   의무가 생기지는 않는다. 작성자가 같은 리뷰어에게 명시적으로
          #                   재요청해야 공이 돌아온다.
          #
          # 그래서 빚은 두 종류다. (1) 아무도 판정을 내리지 않은 PR,
          # (2) PR 전체의 최신 판정이 변경요청이고, 그 리뷰어에게 재요청이 걸렸으며,
          # 그 판정 뒤 작성자가 반영 커밋·응답·PR 본문 편집을 남긴 PR. 재요청이 없거나
          # 최신 변경요청 뒤 작성자 조치가 없으면 빚이 아니다. 반영 커밋은 병합 커밋
          # (parents 2개 이상)을 뺀 실질 커밋으로만 센다.
          debt_file=$(mktemp)
          reviews_file=$(mktemp)
          while IFS=$'\t' read -r pn created pr_author requested_reviewers title; do
            [ -n "$pn" ] || continue

            if ! gh api "repos/$REPO/pulls/$pn/reviews" --paginate \
              --jq '.[] | select(.state == "APPROVED" or .state == "CHANGES_REQUESTED")
                        | {u: .user.login, s: .state, t: .submitted_at}' \
              > "$reviews_file"; then
              echo "::error::PR #$pn 리뷰 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi

            if [ ! -s "$reviews_file" ]; then
              echo "#$pn — 아무도 판정하지 않음"
              printf '%s\t%s\t%s\n' "$pn" "$created" "$title" >> "$debt_file"
              continue
            fi

            # PR 전체의 최신 판정만 본다. 그 판정이 CHANGES_REQUESTED 이면서 현재 같은
            # 리뷰어에게 요청이 다시 걸렸다면, 리뷰 제출 시 제거된 요청을 작성자가
            # 최신 판정 뒤 명시적으로 되살린 것이다. 이후 다른 리뷰어가 더 늦게 판정한
            # 경우에는 과거 리뷰어의 남은 요청으로 공을 되돌리지 않는다.
            if ! blocked=$(jq -rs --arg active ",$requested_reviewers," '
                                  sort_by(.t) | last
                                  | .u |= ascii_downcase
                                  | select(.s == "CHANGES_REQUESTED")
                                  | select(.u as $reviewer
                                           | $active | contains("," + $reviewer + ","))
                                  | [.u, .t] | @tsv' \
                                "$reviews_file"); then
              echo "::error::PR #$pn 최신 리뷰 판정에 실패했다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi

            if [ -z "$blocked" ]; then
              echo "#$pn — 결정 리뷰 뒤 명시적 재리뷰 요청 없음, 빚 아님"
              continue
            fi
            IFS=$'\t' read -r blocked_by blocked_at <<< "$blocked"

            # 면제 리뷰어가 낸 변경요청은 팀의 빚으로 돌아오지 않는다 (#1910). 면제된 사람은
            # 리뷰할 의무가 없으므로, 그가 자발적으로 낸 변경요청 뒤 침묵하면 그 침묵의 대가를
            # 나머지 팀원이 "새 PR 을 못 연다" 로 치르게 된다. 여기서 세지 않아도 그 PR 이
            # 그냥 머지되지는 않는다. 승인 1건이 머지 게이트에 그대로 남아 있다.
            # jq 의 최신 판정은 이미 소문자로 내려온다.
            case " $exempt_lc " in
              *" $blocked_by "*)
                echo "#$pn — 면제 리뷰어 @$blocked_by 의 변경요청, 팀 빚 아님"
                continue
                ;;
            esac

            # 반영을 비병합 커밋으로만 세면 병합으로 반영한 PR 을 놓친다. base 를
            # 끌어와 충돌을 풀며 지적을 반영하면 그 뒤 커밋이 전부 parents 2개라
            # «미반영» 이 된다 — #1316 은 리뷰가 지목한 파일이 실제로 바뀌고 작성자
            # 응답 코멘트까지 2건 달린 채로 8/29 까지 빚에서 빠져 있었다(#1450).
            # 병합 커밋의 first-parent diff 는 base 에서 들어온 변경을 통째로 담아
            # 반영분과 구별되지 않으므로, 커밋 대신 «작성자가 응답했는가» 를 함께 본다.
            #
            # 페이지마다 집계하면 100건이 넘는 PR 에서 숫자가 여러 줄로 나와 비교가
            # 깨진다. 건별로 뽑아 한 번에 센다.
            #
            # 세는 것은 «작성자가 올린 실질 변경» 뿐이다. 누가 올렸는지·무엇이 바뀌었는지를
            # 안 보면 리뷰어가 미는 CI 재트리거 빈 커밋까지 «작성자가 반영했다» 로 세어,
            # 재트리거한 리뷰어가 그 대가로 자기 PR 을 못 열게 된다 — 8/28 에 리뷰어가 건
            # +0/-0 커밋 하나로 koongmai PR 3건(#1379·#1365·#882)이 전부 가짜 빚이 됐다(#1459).
            commits_file=$(mktemp)
            if ! gh api "repos/$REPO/pulls/$pn/commits?per_page=100" --paginate \
              --jq '.[] | select((.parents | length) < 2)
                        | [.sha, (.author.login // ""), (.commit.author.email // ""), .commit.committer.date]
                        | @tsv' > "$commits_file"; then
              echo "::error::PR #$pn 커밋 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi

            # 계정이 연결되지 않은 커밋은 .author 가 비어 login 으로 가릴 수 없다. 같은 PR 에서
            # 작성자 것으로 확인된 커밋의 이메일을 모아 폴백 신원으로 쓴다.
            author_emails=$(awk -F'\t' -v author="$pr_author" '
              BEGIN { target = tolower(author) }
              tolower($2) == target && $3 != "" { print tolower($3) }' "$commits_file" | sort -u)

            author_commits=$(awk -F'\t' -v author="$pr_author" -v cutoff="$blocked_at" -v emails="$author_emails" '
              BEGIN {
                target = tolower(author)
                count = split(emails, list, "\n")
                for (i = 1; i <= count; i++) if (list[i] != "") own[list[i]] = 1
              }
              $4 > cutoff {
                login = tolower($2)
                email = tolower($3)
                if (login != "") { if (login == target) print $1 }
                else if (email != "" && (email in own)) print $1
              }' "$commits_file")

            # 빈 커밋은 반영이 아니다. pulls/{n}/commits 응답에는 파일 정보가 없어 후보에
            # 한해 commits/{sha} 를 더 조회한다 — 후보는 대개 한 자릿수라 비용이 작다.
            # 조회 실패를 반영·미반영 어느 쪽으로도 접지 않는다. 불완전한 근거로 남의 PR 을
            # 닫지 않고 가드를 실패시켜 재실행하게 한다.
            fixed=0
            while IFS= read -r sha; do
              [ -n "$sha" ] || continue
              if ! changed=$(gh api "repos/$REPO/commits/$sha" --jq '(.files // []) | length'); then
                echo "::error::PR #$pn 커밋 $sha 변경 파일 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다"
                exit 1
              fi
              case "$changed" in
                ''|*[!0-9]*)
                  echo "::error::PR #$pn 커밋 $sha 변경 파일 수가 올바르지 않다($changed)"
                  exit 1
                  ;;
              esac
              [ "$changed" -gt 0 ] || continue
              fixed=$((fixed + 1))
            done <<< "$author_commits"

            if ! said=$(gh api "repos/$REPO/issues/$pn/comments?per_page=100" --paginate \
              --jq ".[] | select(.user.login == \"$pr_author\")
                        | select(.created_at > \"$blocked_at\") | .id" \
              | wc -l | tr -d ' '); then
              echo "::error::PR #$pn 작성자 일반 응답 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi

            if ! answered=$(gh api "repos/$REPO/pulls/$pn/comments?per_page=100" --paginate \
              --jq ".[] | select(.user.login == \"$pr_author\")
                        | select(.created_at > \"$blocked_at\") | .id" \
              | wc -l | tr -d ' '); then
              echo "::error::PR #$pn 작성자 리뷰 응답 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi

            # PR 본문은 커밋 없이도 CI 계약·설명을 고치는 변경 표면이다(#771). REST 의
            # updated_at 은 댓글·라벨까지 섞이고 GraphQL lastEditedAt 은 마지막 편집자만
            # 남기므로, 영속 편집 이력에서 «최신 변경요청 뒤 작성자가 직접 고친 본문»만 센다.
            # 최근 50건보다 많은 편집 이력이 있으면 필요한 구간이 잘렸을 수 있으므로
            # 근거 없이 작성자·리뷰어 어느 쪽으로도 공을 넘기지 않고 가드를 실패시킨다.
            # shellcheck disable=SC2016 # GraphQL 변수는 gh가 -F 값으로 바인딩한다.
            if ! edits_json=$(gh api graphql \
              -F owner="$repo_owner" \
              -F name="$repo_name" \
              -F number="$pn" \
              -f query='query($owner:String!,$name:String!,$number:Int!){repository(owner:$owner,name:$name){pullRequest(number:$number){userContentEdits(last:50){pageInfo{hasPreviousPage} nodes{editedAt editor{login}}}}}}'); then
              echo "::error::PR #$pn 본문 편집 이력 조회에 실패했다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi
            if ! body_edits=$(jq -er \
              --arg author "$pr_author" \
              --arg cutoff "$blocked_at" '
                .data.repository.pullRequest.userContentEdits as $edits
                | if ($edits.pageInfo.hasPreviousPage != false) then
                    error("최근 50건보다 많은 본문 편집 이력")
                  else
                    [
                      $edits.nodes[]
                      | select(((.editor.login // "") | ascii_downcase) == ($author | ascii_downcase))
                      | select(.editedAt > $cutoff)
                    ] | length
                  end
              ' <<< "$edits_json"); then
              echo "::error::PR #$pn 본문 편집 이력이 불완전하다 — 근거 없이 PR 을 닫지 않는다"
              exit 1
            fi

            responses=$(( ${said:-0} + ${answered:-0} ))

            if [ "${fixed:-0}" -gt 0 ] || [ "$responses" -gt 0 ] || [ "$body_edits" -gt 0 ]; then
              echo "#$pn — @$blocked_by 재리뷰 요청 뒤 변경요청 반영(${fixed}커밋 · 응답 ${responses}건 · 본문 편집 ${body_edits}건), 아직 미응답"
              printf '%s\t%s\t%s\n' "$pn" "$created" "$title" >> "$debt_file"
            else
              echo "#$pn — 변경요청 미반영, 공은 작성자에게"
            fi
          done <<< "$open_prs"

          if [ ! -s "$debt_file" ] && [ ! -s "$author_debt_file" ]; then
            echo "리뷰·작성자 응답을 기다리는 PR 없음 — 통과"
            exit 0
          fi

          debt=$(cat "$debt_file")
          author_debt=$(cat "$author_debt_file")
          review_count=$(wc -l < "$debt_file" | tr -d ' ')
          author_count=$(wc -l < "$author_debt_file" | tr -d ' ')
          count=$(( review_count + author_count ))
          today=$(date -u +%s)

          {
            echo "## 🚧 리뷰 적체 가드 — 이 PR 을 닫습니다"
            echo
            if [ "$review_count" -gt 0 ]; then
              echo "### 팀 리뷰 응답 대기 · ${review_count}건"
              echo
              echo "| PR | 열린 날 | 경과 | 제목 |"
              echo "|---|---|---|---|"
              while IFS=$'\t' read -r n created title; do
                [ -n "$n" ] || continue
                opened=$(date -u -d "$created" +%s 2>/dev/null || echo "$today")
                days=$(( (today - opened) / 86400 ))
                echo "| #$n | $created | ${days}일 | $title |"
              done <<< "$debt"
              echo
            fi
            if [ "$author_count" -gt 0 ]; then
              echo "### 작성자 응답 대기 · ${author_count}건"
              echo
              echo "| PR | 열린 날 | 변경요청자 | 제목 |"
              echo "|---|---|---|---|"
              while IFS=$'\t' read -r n created reviewer title; do
                [ -n "$n" ] || continue
                echo "| #$n | $created | @$reviewer | $title |"
              done <<< "$author_debt"
              echo
            fi
            echo "이 저장소는 팀 리뷰 응답 또는 자기 PR 의 변경요청 대응을 기다리는 PR 이 1건이라도 남아 있으면 새 PR 을 열 수 없습니다 (#1136, #1679)."
            echo
            echo "각 PR 에 필요한 리뷰는 **한 건**입니다 — 누구든 먼저 판정을 내면 그 PR 은 모두의 목록에서 빠집니다. 승인 뒤 변경을 다시 볼 의무는 없고, **변경요청도 작성자가 같은 리뷰어에게 재요청한 뒤 실질 커밋·응답·본문 편집을 남긴 경우에만** 다시 리뷰어의 몫이 됩니다."
            echo "자기 PR 이 **최신 변경요청 뒤 실질 커밋·응답·작성자 본문 편집 없이** 남아 있으면 작성자의 몫입니다. 조치를 남기면 다음 검사에서 작성자 빚이 해소됩니다."
            echo
            echo "### 되살리는 법"
            echo
            echo "위 PR 에 필요한 리뷰나 작성자 조치를 끝낸 뒤 이 PR 을 다시 여세요. **브랜치는 지워지지 않았고 커밋도 그대로입니다.**"
            echo
            echo '```bash'
            echo "gh pr reopen $PR_NUMBER"
            echo '```'
          } > /tmp/debt-comment.md

          echo "리뷰·작성자 미응답 ${count}건 — PR #$PR_NUMBER 를 닫는다"
          gh pr close "$PR_NUMBER" --repo "$REPO" --comment "$(cat /tmp/debt-comment.md)"

      # 실패가 «가드가 사실을 확인하고 거절함» 인지 «한도 소진» 인지 가른다. 구분이 없으면
      # 빨간 체크를 보고도 원인을 로그까지 들어가야 안다 (#1465).
      - name: Classify a failed gate as rate limit exhaustion
        if: failure()
        run: |
          # default branch 사본에 이 스크립트가 아직 없는 동안(= 스크립트를 심는 이 PR 자신)에는
          # 건너뛴다. 머지 뒤에는 항상 존재하므로 이 경로는 부트스트랩 한 번에만 쓰인다.
          if [ ! -f .github/scripts/ensure-api-quota.mjs ]; then
            echo "::notice::quota 스크립트가 default branch 에 아직 없습니다 — 건너뜁니다"
            exit 0
          fi
          node .github/scripts/ensure-api-quota.mjs classify --resource core
          node .github/scripts/ensure-api-quota.mjs classify --resource graphql
        env:
          GH_TOKEN: ${{ github.token }}
