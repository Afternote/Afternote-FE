# PR 머지 순서 가드 (#660)
#
# GitHub 는 이슈 Relationships(blocked_by)를 표시만 하고 머지 버튼을 잠그지 않는다.
# 이 워크플로는 PR 의 closing 이슈에 아직 열린 blocked_by 가 있으면 check 를
# 실패시킨다. branch protection 에서 required check 로 지정하면 머지 버튼이
# 실제로 잠긴다. base 가 develop/main 이 아닌 스택 PR 은 경고로만 남긴다.
#
# base 가 트렁크가 아닌 PR 은 네이티브 스택 등록 여부(stackEntry)도 함께 본다 — 미등록도
# 경고로만 남긴다 (#1474).
name: merge-order-guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  # merge queue 는 큐 ref 에서 guard context 를 다시 요구한다. 큐 ref
  # (gh-readonly-queue/<base>/pr-<N>-<sha>) 에서 PR 번호를 파싱해 같은 검사를 돌린다.
  merge_group:
    types: [checks_requested]
  issues:
    types: [closed, reopened]
  # GITHUB_TOKEN 이 만든 baseline/stack merge commit 에도 최신 SHA 기준 guard 를 붙인다.
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: "검사할 열린 PR 번호"
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  guard:
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 게이트 스크립트는 **default branch 사본**으로 돌린다. PR 사본을 체크아웃하면 PR 이
      # 자기를 검사하는 가드를 고쳐 통과시킬 수 있다. 필요한 건 .github/scripts 뿐이라
      # sparse-checkout 으로 좁힌다.
      - name: Clone gate scripts from the default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      # 한도가 바닥인 채로 들어가면 게이트가 코드와 무관하게 빨개진다. 남은 quota 를 요약에
      # 남기고, 부족하면 리셋까지 기다린다 — 즉시 실패시키면 사람이 재실행을 걸고 그 재실행이
      # 남은 quota 를 더 태운다 (#1465).
      - name: Ensure GitHub API quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # default branch 사본에 이 스크립트가 아직 없는 동안(= 스크립트를 심는 이 PR 자신)에는
          # 건너뛴다. 머지 뒤에는 항상 존재하므로 이 경로는 부트스트랩 한 번에만 쓰인다.
          if [ ! -f .github/scripts/ensure-api-quota.mjs ]; then
            echo "::notice::quota 스크립트가 default branch 에 아직 없습니다 — 건너뜁니다"
            exit 0
          fi
          node .github/scripts/ensure-api-quota.mjs ensure

      - name: closing 이슈 blocked_by 검사
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request_number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref }}
        run: |
          # gh api 실패가 빈 목록으로 위장돼 가드가 초록으로 새는 것 방지(fail-closed)
          set -euo pipefail

          fail=0

          # merge group 은 PR payload 없이 큐 ref 만 준다. 큐에 여러 PR 이 묶여도 ref 는
          # 마지막 PR 번호를 담고, 앞선 PR 들은 이미 같은 검사를 통과해 큐에 들어왔다.
          if [ -z "${PR_NUMBER:-}" ] && [ -n "${MERGE_GROUP_HEAD_REF:-}" ]; then
            queue_tail="${MERGE_GROUP_HEAD_REF##*/pr-}"
            PR_NUMBER="${queue_tail%%-*}"
            BASE_REF="${MERGE_GROUP_BASE_REF#refs/heads/}"
          fi

          if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::유효한 pull_request_number 가 필요합니다"
            exit 1
          fi

          if [ -z "$BASE_REF" ]; then
            BASE_REF=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.base.ref')
          fi

          # 스택 PR 안내 — base 가 부모 브랜치면 애초에 develop 로 머지되지 않고,
          # 부모가 머지되면 GitHub 가 base 를 develop 로 이관하며 이 가드가 다시
          # 돌아 blocked_by 를 검사한다. 실패로 올리면 스택 PR 이 수명 내내 X 로
          # 남아 목록에서 진짜 CI 실패와 구분되지 않으므로 경고로만 남긴다.
          stacked=0
          case "$BASE_REF" in
            develop|main) ;;
            *)
              stacked=1
              echo "::warning::base 가 '$BASE_REF' — 스택 PR 은 base 를 develop 로 PATCH 한 뒤 머지할 것"
              ;;
          esac

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          # 네이티브 스택 등록 여부 — base 이름만으로는 «스택으로 묶인 PR» 과 «base 만 상위
          # 브랜치로 물린 PR» 이 구분되지 않는다. 미등록이어도 머지 순서는 지켜지므로
          # (delete_branch_on_merge 가 밑단 머지 시 base 를 develop 로 이관한다) 막지 않는다.
          # 다만 그 이관의 근거가 스택 기능이 아니라 저장소 설정이고, 등록하지 않으면 스택 맵·
          # 서버측 자동 rebase·gh stack merge 를 못 얻으므로 그 사실은 드러낸다 (#1474).
          #
          # error 로 올리지 않는 이유는 CI 가 고칠 수 없기 때문이다 — GraphQL 에 스택 뮤테이션이
          # 없고(PullRequestStack* 은 읽기 전용), 열린 PR 을 묶는 경로는 `gh stack submit` 의
          # 대화형 Ctrl+B 뿐이다. 막으면 #1059 가 이미 걷어낸 «수명 내내 red» 가 되돌아온다.
          # 조회 자체는 `if` 조건에 두어 실패가 blocked_by 판정을 막지 않게 한다 — 경고 하나 때문에
          # 머지 게이트가 죽으면 안 된다. blocked_by 쪽 조회는 그대로 fail-closed 로 남는다.
          if [ "$stacked" -eq 1 ]; then
            if stack_entry=$(gh api graphql \
              -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){stackEntry{position}}}}' \
              -f owner="$owner" -f repo="$repo" -F pr="$PR_NUMBER" \
              --jq '.data.repository.pullRequest.stackEntry'); then
              if [ -z "$stack_entry" ] || [ "$stack_entry" = "null" ]; then
                echo "::warning::네이티브 스택 미등록 — 터미널에서 'gh stack init --base develop <밑단> <윗단>' 뒤 'gh stack submit' 에서 새 PR 을 모두 해제하고 Ctrl+B 로 링크할 것"
              fi
            else
              echo "::warning::스택 등록 여부를 조회하지 못했다 — 등록 상태를 손으로 확인할 것"
            fi
          fi

          pr_json=$(gh api graphql \
            -f query='query($owner:String!,$repo:String!,$pr:Int!){repository(owner:$owner,name:$repo){pullRequest(number:$pr){title body closingIssuesReferences(first:20){nodes{number repository{nameWithOwner}}}}}}' \
            -f owner="$owner" -f repo="$repo" -F pr="$PR_NUMBER" \
            --jq '.data.repository.pullRequest')

          # GitHub 가 close keyword 를 closingIssuesReferences 로 승격하지 못하는 경우가
          # 있으므로(#879, #880, #1176), 제목·본문을 같은 공식 패턴으로 직접 파싱한다.
          # 외부 저장소 참조는 이 저장소의 머지 순서와 무관하므로 제외한다.
          issues=$(
            PR_JSON="$pr_json" node <<'NODE'
          const pr = JSON.parse(process.env.PR_JSON);
          const ownRepo = process.env.GITHUB_REPOSITORY.toLowerCase();
          const issues = new Set(
              pr.closingIssuesReferences.nodes
                  .filter(({ repository }) => repository.nameWithOwner.toLowerCase() === ownRepo)
                  .map(({ number }) => number),
          );
          const text = `${pr.title}\n\n${pr.body || ""}`;
          const regex = /\b(?:close[ds]?|fix(?:e[ds])?|resolve[ds]?)\s+(?:([\w.-]+\/[\w.-]+))?#(\d+)/gi;
          let match;

          while ((match = regex.exec(text)) !== null) {
              const referencedRepo = (match[1] || ownRepo).toLowerCase();
              if (referencedRepo !== ownRepo) continue;
              issues.add(Number.parseInt(match[2], 10));
          }

          process.stdout.write([...issues].sort((a, b) => a - b).join("\n"));
          NODE
          )

          for n in $issues; do
            issue_kind=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n" \
              --jq 'if has("pull_request") then "pull_request" else "issue" end')
            if [ "$issue_kind" = "pull_request" ]; then
              echo "::notice::#$n 은 PR 참조 — blocked_by 검사 대상에서 제외"
              continue
            fi

            open_blockers=$(gh api "repos/$GITHUB_REPOSITORY/issues/$n/dependencies/blocked_by" \
              --jq '.[] | select(.state == "open") | .number')
            for b in $open_blockers; do
              if [ "$stacked" -eq 1 ]; then
                # 스택 PR 은 develop 로 직접 머지되지 않는다. base 가 develop 로
                # 이관되는 순간 이 가드가 다시 돌아 error 로 막으므로, 그전까지는
                # 경고로만 남겨 진짜 CI 실패와 구분되게 한다.
                echo "::warning::#$n 이 아직 열린 #$b 에 blocked — base 를 develop 로 이관하기 전에 선행 PR 부터 머지할 것"
              else
                echo "::error::#$n 이 아직 열린 #$b 에 blocked — 머지 순서 위반. 선행 PR 부터 머지할 것"
                fail=1
              fi
            done
          done

          exit "$fail"

  # blocker 이슈가 닫히면(=선행 PR 머지) 기다리던 PR 의 guard 를 재실행해 초록으로 갱신한다.

      # 실패가 «가드가 사실을 확인하고 거절함» 인지 «한도 소진» 인지 가른다. 구분이 없으면
      # 빨간 체크를 보고도 원인을 로그까지 들어가야 안다 (#1465).
      - name: Classify a failed gate as rate limit exhaustion
        if: failure()
        run: |
          # default branch 사본에 이 스크립트가 아직 없는 동안(= 스크립트를 심는 이 PR 자신)에는
          # 건너뛴다. 머지 뒤에는 항상 존재하므로 이 경로는 부트스트랩 한 번에만 쓰인다.
          if [ ! -f .github/scripts/ensure-api-quota.mjs ]; then
            echo "::notice::quota 스크립트가 default branch 에 아직 없습니다 — 건너뜁니다"
            exit 0
          fi
          node .github/scripts/ensure-api-quota.mjs classify
        env:
          GH_TOKEN: ${{ github.token }}
  refresh:
    if: github.event_name == 'issues'
    permissions:
      actions: write # gh run rerun — 필요한 이 잡에만 job-level 로 한정
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 이 이슈가 blocking 하던 열린 PR 의 guard 재실행
        env:
          GH_TOKEN: ${{ github.token }}
          # 셸 보간은 없지만 gh CLI 가 소비한다 — checkout 없는 러너에서
          # gh run list/rerun 의 저장소 컨텍스트가 이 env 로만 잡힌다.
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"

          blocked=$(gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE/dependencies/blocking" \
            --jq '.[].number')
          if [ -z "$blocked" ]; then
            echo "이 이슈가 blocking 하는 이슈 없음 — 재실행 대상 없음"
            exit 0
          fi

          # closingIssuesReferences 로 승격되지 않은 close keyword도 guard 대상이다. blocker가
          # 닫힐 때 같은 parser로 열린 PR을 다시 찾아야, 그 PR의 stale red check가 갱신된다.
          prs_file="$RUNNER_TEMP/merge-order-open-prs.json"
          gh api graphql --paginate --slurp \
            -f query='query($owner:String!,$repo:String!,$endCursor:String){repository(owner:$owner,name:$repo){pullRequests(states:OPEN,first:100,after:$endCursor){nodes{headRefName title body closingIssuesReferences(first:20){nodes{number repository{nameWithOwner}}}} pageInfo{hasNextPage endCursor}}}}' \
            -f owner="$owner" -f repo="$repo" > "$prs_file"
          heads=$(
            BLOCKED="$blocked" PRS_FILE="$prs_file" node <<'NODE'
          const { readFileSync } = require("node:fs");
          const pages = JSON.parse(readFileSync(process.env.PRS_FILE, "utf8"));
          const blocked = new Set(
              process.env.BLOCKED.split(/\s+/).filter(Boolean).map(Number),
          );
          const ownRepo = process.env.GITHUB_REPOSITORY.toLowerCase();
          const heads = new Set();

          for (const pr of pages.flatMap((page) => page.data.repository.pullRequests.nodes)) {
              const issues = new Set(
                  pr.closingIssuesReferences.nodes
                      .filter(({ repository }) => repository.nameWithOwner.toLowerCase() === ownRepo)
                      .map(({ number }) => number),
              );
              const text = `${pr.title}\n\n${pr.body || ""}`;
              const regex = /\b(?:close[ds]?|fix(?:e[ds])?|resolve[ds]?)\s+(?:([\w.-]+\/[\w.-]+))?#(\d+)/gi;
              let match;

              while ((match = regex.exec(text)) !== null) {
                  const referencedRepo = (match[1] || ownRepo).toLowerCase();
                  if (referencedRepo !== ownRepo) continue;
                  issues.add(Number.parseInt(match[2], 10));
              }

              if ([...issues].some((number) => blocked.has(number))) {
                  heads.add(pr.headRefName);
              }
          }

          process.stdout.write([...heads].sort().join("\n"));
          NODE
          )

          if [ -z "$heads" ]; then
            echo "blocking 하던 이슈를 닫는 열린 PR 없음 — 재실행 대상 없음"
            exit 0
          fi

          for h in $heads; do
            run_id=$(gh run list --workflow merge-order-guard.yml --branch "$h" \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$run_id" ]; then
              # 진행 중 런 재실행 거절 등은 치명 아님 — 경고로만 남긴다
              gh run rerun "$run_id" || echo "::warning::run $run_id 재실행 실패 — 진행 중이거나 권한 문제"
            fi
          done
