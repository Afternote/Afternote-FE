name: Android Dependency Audit

# Claude Code 루틴보다 먼저 기계적 증거를 만든다.
# GitHub schedule은 UTC이며 정각 부하를 피하도록 월요일 06:17 KST에 실행한다.
on:
  schedule:
    - cron: '17 21 * * 0'
  workflow_dispatch:
    inputs:
      publish_issues:
        description: "감사 결과로 GitHub 이슈를 생성·갱신"
        required: true
        default: false
        type: boolean

concurrency:
  group: android-dependency-audit
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  audit:
    name: Collect and verify dependency evidence
    runs-on: ubuntu-latest
    env:
      REPORT_DIR: build/reports/dependency-audit
    steps:
      - name: Clone default branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true

      - name: Verify required secrets are set
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          missing=""
          [ -z "$KAKAO_NATIVE_APP_KEY" ] && missing="$missing KAKAO_NATIVE_APP_KEY"
          [ -z "$GOOGLE_WEB_CLIENT_ID" ] && missing="$missing GOOGLE_WEB_CLIENT_ID"
          [ -z "$GOOGLE_SERVICES_JSON_B64" ] && missing="$missing GOOGLE_SERVICES_JSON_B64"
          if [ -n "$missing" ]; then
            echo "::error::필수 secret 누락:$missing — Settings → Secrets and variables → Actions 에 등록"
            exit 1
          fi

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: echo "$GOOGLE_SERVICES_JSON_B64" | base64 -d > app/google-services.json

      - name: Run dependency audit script tests
        run: node --test .github/scripts/*.test.mjs

      - name: Collect resolved Gradle dependency graphs
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          mkdir -p "$REPORT_DIR/resolved"
          : > "$REPORT_DIR/resolution-status.txt"

          run_report() {
            name="$1"
            shift
            set +e
            ./gradlew "$@" --console=plain > "$REPORT_DIR/resolved/$name.txt" 2>&1
            status=$?
            set -e
            printf '%s=%s\n' "$name" "$status" >> "$REPORT_DIR/resolution-status.txt"
          }

          run_report root-build-environment buildEnvironment
          run_report app-debug-runtime :app:dependencies --configuration debugRuntimeClasspath
          run_report konsist-test-runtime :konsist:dependencies --configuration testRuntimeClasspath
          run_report onboarding-domain-runtime :feature:onboarding:domain:dependencies --configuration runtimeClasspath
          run_report setting-domain-runtime :feature:setting:domain:dependencies --configuration runtimeClasspath

      - name: Run current SDK and JVM compatibility gate
        id: compatibility
        continue-on-error: true
        env:
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set +e
          ./gradlew assembleDebug testDebugUnitTest :konsist:test :build-logic:test \
            --continue --parallel --console=plain > "$REPORT_DIR/compatibility.log" 2>&1
          status=$?
          set -e
          printf '{"exitCode":%s}\n' "$status" > "$REPORT_DIR/compatibility-status.json"
          tail -n 200 "$REPORT_DIR/compatibility.log"
          exit "$status"

      - name: Collect Maven metadata and OSV evidence
        run: |
          node .github/scripts/collect-dependency-audit.mjs \
            --root . \
            --resolved-report "$REPORT_DIR/resolved/root-build-environment.txt" \
            --resolved-report "$REPORT_DIR/resolved/app-debug-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/konsist-test-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/onboarding-domain-runtime.txt" \
            --resolved-report "$REPORT_DIR/resolved/setting-domain-runtime.txt" \
            --resolution-status "$REPORT_DIR/resolution-status.txt" \
            --compatibility-status "$REPORT_DIR/compatibility-status.json" \
            --output "$REPORT_DIR/dependency-audit.json" \
            --summary "$REPORT_DIR/dependency-audit.md"

      - name: Add audit to job summary
        run: cat "$REPORT_DIR/dependency-audit.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update actionable issues
        if: github.event_name == 'schedule' || inputs.publish_issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node .github/scripts/publish-dependency-audit-issues.mjs \
            "$REPORT_DIR/dependency-audit.json" \
            .github/ISSUE_TEMPLATE/custom.md

      - name: Upload machine-readable audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-dependency-audit
          path: ${{ env.REPORT_DIR }}
          retention-days: 14

      - name: Fail when current compatibility gate failed
        if: steps.compatibility.outcome == 'failure'
        run: exit 1
