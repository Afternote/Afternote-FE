name: Latest Review Decision Event

# pull_request_review는 fork PR의 read-only 토큰으로도 발생한다. 여기서는 PR 코드나 API를
# 건드리지 않고 완료 신호만 만든다. 실제 쓰기는 trusted default-branch workflow가 맡는다.
on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  signal:
    name: Signal latest review decision reconciliation
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Record review decision event
        run: echo 'A pull request review decision was submitted.'
